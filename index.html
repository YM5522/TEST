<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Golf Ball Picker Real</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:#102b18;
  font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
}
.wrap{width:min(1200px,100vw);padding:8px}
canvas{
  width:100%;
  aspect-ratio:16/9;
  display:block;
  border-radius:16px;
  background:#6cae50;
  box-shadow:0 18px 50px rgba(0,0,0,.35);
  touch-action:none;
}
.ui{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center}
button{
  border:0;border-radius:999px;padding:11px 16px;background:white;
  color:#17331d;font-weight:800;font-size:15px;box-shadow:0 5px 14px rgba(0,0,0,.22)
}
.pad{display:grid;grid-template-columns:64px 64px 64px;grid-template-rows:54px 54px;gap:8px;justify-content:center;margin-top:10px}
.pad button{border-radius:16px;padding:0;font-size:22px}
.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
@media(min-width:760px){.pad{display:none}}
</style>
</head>

<button id="start">スタート / 次ステージ</button>

<div class="pad">
<button class="up" data-d="up">▲</button>
<button class="left" data-d="left">◀</button>
<button class="down" data-d="down">▼</button>
<button class="right" data-d="right">▶</button>
</div>
</div>

const keys={}, touch={up:false,down:false,left:false,right:false};

const tools=[
 {name:"手拾い",cost:0,cap:3,speed:260,radius:45,front:0,width:0},
 {name:"両手拾い",cost:80,cap:8,speed:275,radius:60,front:0,width:0},
 {name:"チューブ型",cost:180,cap:18,speed:285,radius:70,front:80,width:70},
 {name:"熊手型",cost:360,cap:35,speed:295,radius:70,front:105,width:145},
 {name:"ローラー式集球器",cost:700,cap:80,speed:310,radius:85,front:170,width:230}
];

let g,last=performance.now();

function reset(){
 g={
  mode:"title",stage:1,points:0,time:75,tool:0,
  player:{x:520,y:560,carry:0,dir:0,walk:0},
  pros:[],balls:[],fx:[],msg:"画面タップで開始"
 };
}

function startStage(){
 g.mode="play";g.balls=[];g.pros=[];g.player.x=520;g.player.y=560;g.player.carry=0;
 g.time=75+Math.min(45,(g.stage-1)*8);
 const n=g.stage+1;
 const spots=[
  [145,470],[520,305],[805,300],[970,400],[350,270],[1120,320],[660,250],[230,360]
 ];
 for(let i=0;i<n;i++){
  const s=spots[i%spots.length];
  g.pros.push({id:i+1,x:s[0],y:s[1],balls:20,cd:3+i*.7,swing:0});
 }
 g.msg="STAGE "+g.stage;
}

function openShop(){g.mode="shop";g.msg="ショップで強化";}

function dist(a,b,c,d){return Math.hypot(a-c,b-d)}

function greenPoint(){
 const zones=[
  [930,420,300,115],
  [720,360,250,95],
  [1030,500,210,80],
  [520,420,220,90]
 ];
 const z=zones[Math.floor(Math.random()*zones.length)];
 const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random());
 return {x:z[0]+Math.cos(a)*z[2]*r,y:z[1]+Math.sin(a)*z[3]*r};
}

function shoot(p){
 p.balls--;
 p.swing=.35;
 const target=greenPoint();
 g.balls.push({
  x:p.x,y:p.y,sx:p.x,sy:p.y,tx:target.x,ty:target.y,t:0,z:0,fly:true
 });
 if(p.balls<=0){g.mode="over";g.msg="プロ"+p.id+"の球がなくなった！";}
}

function update(dt){
 if(g.mode!=="play")return;
 g.time-=dt;
 if(g.time<=0){
  g.points+=120+g.stage*70;g.stage++;openShop();g.msg="ステージクリア！";return;
 }
 const tool=tools[g.tool],p=g.player;
 let vx=0,vy=0;
 if(keys.ArrowLeft||keys.a||touch.left)vx--;
 if(keys.ArrowRight||keys.d||touch.right)vx++;
 if(keys.ArrowUp||keys.w||touch.up)vy--;
 if(keys.ArrowDown||keys.s||touch.down)vy++;
 const l=Math.hypot(vx,vy)||1;
 if(vx||vy){p.dir=Math.atan2(vy,vx);p.walk+=dt*8;}
 p.x=Math.max(55,Math.min(W-55,p.x+vx/l*tool.speed*dt));
 p.y=Math.max(170,Math.min(H-55,p.y+vy/l*tool.speed*dt));

 for(const pro of g.pros){
  pro.cd-=dt;if(pro.swing>0)pro.swing-=dt;
  if(pro.cd<=0&&g.mode==="play"){pro.cd+=5;shoot(pro);}
 }
 for(const b of g.balls){
  if(b.fly){
   b.t+=dt/1.05;
   const t=Math.min(1,b.t),e=1-Math.pow(1-t,3);
   b.x=b.sx+(b.tx-b.sx)*e;b.y=b.sy+(b.ty-b.sy)*e;b.z=Math.sin(t*Math.PI)*115;
   if(t>=1){b.fly=false;b.x=b.tx;b.y=b.ty;b.z=0;}
  }
 }
 pickup(tool,p);
 refill(p);
 g.fx=g.fx.filter(f=>{f.life-=dt;f.y-=dt*35;return f.life>0});
}

function pickup(tool,p){
 let maxPick = g.tool>=4 ? 99 : g.tool>=3 ? 8 : g.tool>=2 ? 5 : 2;
 let picked=0;
 for(let i=g.balls.length-1;i>=0;i--){
  if(p.carry>=tool.cap)break;
  const b=g.balls[i]; if(b.fly)continue;
  let hit=dist(p.x,p.y,b.x,b.y)<tool.radius;

  if(!hit && tool.front>0){
   const dx=b.x-p.x,dy=b.y-p.y;
   const ca=Math.cos(-p.dir),sa=Math.sin(-p.dir);
   const lx=dx*ca-dy*sa,ly=dx*sa+dy*ca;
   hit = lx>0 && lx<tool.front && Math.abs(ly)<tool.width/2;
  }

  if(hit){
   g.balls.splice(i,1);
   p.carry++;
   g.points+=2;
   picked++;
   pop(b.x,b.y,"拾った");
   if(picked>=maxPick)break;
  }
 }
}

function refill(p){
 for(const pro of g.pros){
  if(p.carry>0 && dist(p.x,p.y,pro.x,pro.y)<95){
   const give=Math.min(20-pro.balls,p.carry);
   if(give>0){
    pro.balls+=give;p.carry-=give;g.points+=give*5;
    pop(pro.x,pro.y,"補充 +"+give);
   }
  }
 }
}

function pop(x,y,t){g.fx.push({x,y,t,life:.75})}

function buy(i){
 if(g.mode!=="shop")return;
 const item=tools[i]; if(!item||g.tool>=i)return;
 if(g.points>=item.cost){g.points-=item.cost;g.tool=i;g.msg=item.name+"を購入";}
 else g.msg="ポイント不足";
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function draw(){
 ctx.clearRect(0,0,W,H);
 drawPhoto();
 drawPlayableTint();
 drawBalls();
 drawPros();
 drawPlayer();
 drawHud();
 drawFx();
 if(g.mode!=="play")drawOverlay();
}

function drawPhoto(){
 if(bg.complete && bg.naturalWidth){
  const scale=Math.max(W/bg.naturalWidth,H/bg.naturalHeight);
  const iw=bg.naturalWidth*scale,ih=bg.naturalHeight*scale;
  ctx.drawImage(bg,(W-iw)/2,(H-ih)/2,iw,ih);
 }else{
  const grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,"#bfe4ff");grd.addColorStop(.42,"#eaf7ff");grd.addColorStop(.43,"#6fb85c");grd.addColorStop(1,"#2f7d3b");
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
 }
}

function drawPlayableTint(){
 ctx.fillStyle="rgba(45,125,45,.18)";
 ctx.beginPath();ctx.ellipse(855,430,430,175,0,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=3;ctx.stroke();
}

function drawBalls(){
 for(const b of g.balls){
  ctx.fillStyle="rgba(0,0,0,.22)";
  ctx.beginPath();ctx.ellipse(b.x,b.y+5,8,3,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff";
  ctx.beginPath();ctx.arc(b.x,b.y-b.z,6,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="rgba(0,0,0,.25)";ctx.stroke();
 }
}

function drawPros(){
 for(const p of g.pros){
  ctx.save();ctx.translate(p.x,p.y);
  ctx.fillStyle="rgba(0,0,0,.22)";ctx.beginPath();ctx.ellipse(0,42,38,10,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff";ctx.fillRect(-12,-42,24,54);
  ctx.fillStyle="#ffd6a5";ctx.beginPath();ctx.arc(0,-55,14,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff";ctx.fillRect(-18,-72,36,12);
  ctx.fillStyle="#111";ctx.fillRect(-26,15,52,30);
  ctx.fillStyle="#fff";
  for(let i=0;i<Math.min(10,p.balls);i++){ctx.beginPath();ctx.arc(-20+(i%5)*10,24+Math.floor(i/5)*9,4,0,Math.PI*2);ctx.fill();}
  ctx.strokeStyle="#222";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(10,-8);ctx.lineTo(p.swing>0?-45:42,40);ctx.stroke();
  ctx.fillStyle=p.balls<=5?"#ff3333":"#fff";ctx.font="bold 18px system-ui";ctx.textAlign="center";ctx.fillText(p.balls,0,70);
  ctx.restore();
 }
}

function drawPlayer(){
 const p=g.player,tool=tools[g.tool];
 ctx.save();ctx.translate(p.x,p.y);

 ctx.fillStyle="rgba(255,255,255,.16)";
 ctx.beginPath();ctx.arc(0,0,tool.radius,0,Math.PI*2);ctx.fill();
 if(tool.front>0){
  ctx.save();ctx.rotate(p.dir);
  ctx.fillStyle="rgba(255,255,255,.17)";
  ctx.fillRect(0,-tool.width/2,tool.front,tool.width);
  ctx.restore();
 }

 ctx.fillStyle="rgba(0,0,0,.25)";ctx.beginPath();ctx.ellipse(0,42,34,10,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#ff7a00";ctx.fillRect(-13,-8,26,55);
 ctx.fillStyle="#0b2447";ctx.fillRect(-16,-48,32,45);
 ctx.fillStyle="#ffd6a5";ctx.beginPath();ctx.arc(0,-62,14,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#fff";ctx.fillRect(-20,-79,40,12);

 drawTool(tool,p.dir);

 ctx.restore();
 ctx.fillStyle="rgba(255,255,255,.92)";rr(p.x-54,p.y-115,108,32,14);ctx.fill();
 ctx.fillStyle="#17331d";ctx.font="bold 15px system-ui";ctx.textAlign="center";
 ctx.fillText("持球 "+p.carry+"/"+tool.cap,p.x,p.y-94);
}

function drawTool(tool,dir){
 ctx.save();ctx.rotate(dir);
 if(g.tool===4){
  ctx.strokeStyle="#00a884";ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(0,8);ctx.lineTo(70,45);ctx.moveTo(0,8);ctx.lineTo(70,-45);ctx.stroke();
  ctx.fillStyle="rgba(15,15,15,.82)";rr(58,-30,55,60,8);ctx.fill();
  ctx.strokeStyle="#111";ctx.lineWidth=5;
  ctx.beginPath();ctx.arc(118,-30,18,0,Math.PI*2);ctx.arc(118,30,18,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle="#00a884";ctx.lineWidth=10;
  ctx.beginPath();ctx.moveTo(125,-62);ctx.lineTo(210,-82);ctx.moveTo(125,62);ctx.lineTo(210,82);ctx.stroke();
 }else if(g.tool>=3){
  ctx.strokeStyle="#b9e769";ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(105,0);ctx.stroke();
  for(let i=-5;i<=5;i++){ctx.beginPath();ctx.moveTo(94,i*10);ctx.lineTo(128,i*10);ctx.stroke();}
 }else if(g.tool>=2){
  ctx.strokeStyle="#dff9fb";ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(75,0);ctx.stroke();
 }else{
  ctx.strokeStyle="#fff";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(45,0);ctx.stroke();
 }
 ctx.restore();
}

function drawHud(){
 ctx.fillStyle="rgba(255,255,255,.88)";rr(18,14,590,88,18);ctx.fill();
 ctx.fillStyle="#17331d";ctx.font="bold 22px system-ui";ctx.textAlign="left";
 ctx.fillText("STAGE "+g.stage,40,48);
 ctx.fillText("POINT "+g.points,190,48);
 ctx.fillText("TIME "+Math.ceil(g.time),380,48);
 ctx.font="15px system-ui";ctx.fillText("装備："+tools[g.tool].name+"　※白い範囲に入ると拾えます",40,80);

 ctx.fillStyle="rgba(0,0,0,.42)";rr(860,14,402,88,18);ctx.fill();
 ctx.fillStyle="#fff";ctx.font="bold 16px system-ui";ctx.fillText("ルール：プロの籠が0球になったら終了",885,48);
 ctx.font="14px system-ui";ctx.fillText("拾った球はプロに近づくと自動補充",885,78);
}

function drawFx(){
 ctx.textAlign="center";ctx.font="bold 15px system-ui";
 for(const f of g.fx){
  ctx.globalAlpha=Math.max(0,f.life/.75);
  ctx.fillStyle="#fff";ctx.fillText(f.t,f.x,f.y);
  ctx.globalAlpha=1;
 }
}

function drawOverlay(){
 ctx.fillStyle="rgba(0,0,0,.50)";ctx.fillRect(0,0,W,H);
 ctx.fillStyle="rgba(255,255,255,.96)";rr(W/2-335,H/2-205,670,410,28);ctx.fill();
 ctx.fillStyle="#17331d";ctx.textAlign="center";
 ctx.font="bold 34px system-ui";
 ctx.fillText(g.mode==="shop"?"SHOP":g.mode==="over"?"GAME OVER":"Golf Ball Picker",W/2,H/2-135);
 ctx.font="20px system-ui";ctx.fillText(g.msg,W/2,H/2-92);

 if(g.mode==="shop"){
  ctx.textAlign="left";ctx.font="bold 18px system-ui";ctx.fillText("現在ポイント："+g.points,W/2-270,H/2-45);
  for(let i=1;i<tools.length;i++){
   const item=tools[i],owned=g.tool>=i;
   ctx.fillStyle=owned?"#2ecc71":g.points>=item.cost?"#17331d":"#999";
   ctx.fillText(i+". "+item.name+"　"+(owned?"購入済み":item.cost+"pt"),W/2-270,H/2+i*44-35);
  }
  ctx.fillStyle="#17331d";ctx.textAlign="center";ctx.font="16px system-ui";
  ctx.fillText("数字キー1〜4で購入 / スタートで次ステージ",W/2,H/2+165);
 }else{
  ctx.fillStyle="#17331d";rr(W/2-115,H/2-32,230,64,18);ctx.fill();
  ctx.fillStyle="#fff";ctx.font="bold 26px system-ui";ctx.fillText("START",W/2,H/2+10);
  ctx.fillStyle="#17331d";ctx.font="16px system-ui";ctx.fillText("画面タップでも開始",W/2,H/2+72);
 }
}

function action(){
 if(g.mode==="play")return;
 if(g.mode==="title"||g.mode==="over"){reset();startStage();}
 else if(g.mode==="shop")startStage();
}

function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 update(dt);draw();requestAnimationFrame(loop);
}

document.addEventListener("keydown",e=>{keys[e.key]=true;if(["1","2","3","4"].includes(e.key))buy(+e.key);});
document.addEventListener("keyup",e=>{keys[e.key]=false;});
document.getElementById("start").onclick=action;
document.getElementById("shop").onclick=()=>{if(g.mode==="play")openShop();else if(g.mode==="shop")startStage();};
document.getElementById("reset").onclick=reset;
canvas.addEventListener("pointerdown",()=>{if(g.mode!=="play")action();});
document.querySelectorAll(".pad button").forEach(b=>{
 const d=b.dataset.d;
 const on=e=>{e.preventDefault();touch[d]=true;};
 const off=e=>{e.preventDefault();touch[d]=false;};
 b.addEventListener("pointerdown",on);b.addEventListener("pointerup",off);b.addEventListener("pointerleave",off);b.addEventListener("pointercancel",off);
});
reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
