<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Approach Green Ball Picker</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  background:linear-gradient(#bfe4ff 0%,#eaf7ff 36%,#17401f 36%,#092010 100%);
  font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;color:#17331d;
}
.wrap{width:min(1180px,100vw);padding:10px}
header{display:flex;justify-content:space-between;gap:8px;color:white;text-shadow:0 2px 5px rgba(0,0,0,.35);margin-bottom:8px}
h1{font-size:clamp(18px,3vw,28px);margin:0}.help{font-size:13px;text-align:right}
canvas{width:100%;aspect-ratio:16/9;border-radius:18px;display:block;background:#7dc76f;box-shadow:0 18px 55px rgba(0,0,0,.35);touch-action:none}
.bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{border:0;border-radius:999px;padding:10px 16px;font-weight:800;background:white;color:#17331d;box-shadow:0 5px 16px rgba(0,0,0,.18);font-size:16px}
.pad{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:48px 48px;justify-content:center;gap:8px;margin-top:10px}
.pad button{border-radius:14px;padding:0;font-size:20px}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
@media(min-width:760px){.pad{display:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Approach Green Ball Picker</h1>
  <div class="help">移動：WASD / 矢印キー / 下のボタン</div>
</header>
<canvas id="game" width="1280" height="720"></canvas>
<div class="bar">
  <button id="startBtn" type="button">スタート / 次ステージ</button>
  <button id="shopBtn" type="button">ショップ</button>
  <button id="resetBtn" type="button">リセット</button>
</div>
<div class="pad">
  <button class="up" data-dir="up" type="button">▲</button>
  <button class="left" data-dir="left" type="button">◀</button>
  <button class="down" data-dir="down" type="button">▼</button>
  <button class="right" data-dir="right" type="button">▶</button>
</div>
</div>

<script>
(function(){
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;

const keys = {};
const mobile = {up:false,down:false,left:false,right:false};

const tools = [
  {name:"手拾い",cost:0,cap:1,speed:245,reach:22,width:28,kind:"hand"},
  {name:"両手拾い",cost:80,cap:4,speed:260,reach:30,width:36,kind:"hand"},
  {name:"チューブ型",cost:180,cap:10,speed:275,reach:44,width:44,kind:"tube"},
  {name:"熊手型",cost:360,cap:22,speed:290,reach:62,width:95,kind:"rake"},
  {name:"ローラー式集球器",cost:700,cap:60,speed:305,reach:90,width:165,kind:"roller"}
];

let game = {};

function resetGame(){
  game = {
    mode:"title",
    stage:1,
    points:0,
    time:75,
    tool:0,
    balls:[],
    pros:[],
    particles:[],
    player:{x:640,y:610,carry:0,dir:-Math.PI/2,walk:0},
    msg:"画面またはスタートをタップ"
  };
}

function startStage(){
  game.mode = "play";
  game.balls = [];
  game.pros = [];
  game.player.x = 640;
  game.player.y = 610;
  game.player.carry = 0;
  game.time = 70 + Math.min(60, (game.stage-1)*8);
  const count = game.stage + 1;
  for(let i=0;i<count;i++){
    const t = count === 1 ? 0.5 : i/(count-1);
    game.pros.push({
      id:i+1,
      x:190 + t*900,
      y:145 + Math.sin(t*Math.PI)*18,
      balls:20,
      cd:5 + i*0.5,
      swing:0,
      color:["#0b2447","#ff7a00","#ffffff","#111111","#f5a623"][i%5]
    });
  }
  game.msg = "STAGE " + game.stage;
}

function openShop(){
  game.mode = "shop";
  game.msg = "ショップで強化できます";
}

function distance(ax,ay,bx,by){
  return Math.hypot(ax-bx, ay-by);
}

function randomGreenPoint(){
  const cx=675, cy=405, rx=505, ry=215;
  const a=Math.random()*Math.PI*2;
  const r=Math.sqrt(Math.random());
  return {x:cx+Math.cos(a)*rx*r, y:cy+Math.sin(a)*ry*r};
}

function shoot(pro){
  pro.balls -= 1;
  pro.swing = 0.35;
  const g = randomGreenPoint();
  game.balls.push({sx:pro.x,sy:pro.y+20,x:pro.x,y:pro.y+20,tx:g.x,ty:g.y,t:0,fly:true,z:0});
  if(pro.balls <= 0){
    game.mode = "over";
    game.msg = "プロ" + pro.id + "の球切れ！ GAME OVER";
  }
}

function update(dt){
  if(game.mode !== "play") return;

  game.time -= dt;
  if(game.time <= 0){
    game.points += 100 + game.stage*60;
    game.stage += 1;
    openShop();
    game.msg = "ステージクリア！";
    return;
  }

  const tool = tools[game.tool];
  const p = game.player;
  let vx=0, vy=0;
  if(keys.ArrowLeft || keys.a || mobile.left) vx--;
  if(keys.ArrowRight || keys.d || mobile.right) vx++;
  if(keys.ArrowUp || keys.w || mobile.up) vy--;
  if(keys.ArrowDown || keys.s || mobile.down) vy++;

  const len = Math.hypot(vx,vy) || 1;
  if(vx || vy){
    p.dir = Math.atan2(vy,vx);
    p.walk += dt*9;
  }
  p.x = Math.max(45, Math.min(W-45, p.x + vx/len*tool.speed*dt));
  p.y = Math.max(115, Math.min(H-45, p.y + vy/len*tool.speed*dt));

  for(const pro of game.pros){
    pro.cd -= dt;
    if(pro.swing > 0) pro.swing -= dt;
    if(pro.cd <= 0 && game.mode === "play"){
      pro.cd += 5;
      shoot(pro);
    }
  }

  for(const b of game.balls){
    if(b.fly){
      b.t += dt/1.05;
      const t = Math.min(1,b.t);
      const e = 1 - Math.pow(1-t,3);
      b.x = b.sx + (b.tx-b.sx)*e;
      b.y = b.sy + (b.ty-b.sy)*e;
      b.z = Math.sin(t*Math.PI)*115;
      if(t >= 1){
        b.fly = false;
        b.x = b.tx;
        b.y = b.ty;
        b.z = 0;
      }
    }
  }

  pickBalls(tool,p);

  for(const pro of game.pros){
    if(p.carry > 0 && distance(p.x,p.y,pro.x,pro.y) < 70){
      const give = Math.min(20-pro.balls, p.carry);
      if(give > 0){
        pro.balls += give;
        p.carry -= give;
        game.points += give*5;
        addParticle(pro.x,pro.y,"+"+give);
      }
    }
  }

  game.particles = game.particles.filter(pt => {
    pt.life -= dt;
    pt.y -= dt*28;
    return pt.life > 0;
  });
}

function pickBalls(tool,p){
  let picked=0;
  for(let i=game.balls.length-1;i>=0;i--){
    const b = game.balls[i];
    if(b.fly || p.carry >= tool.cap) continue;

    let hit = false;
    if(tool.kind === "roller" || tool.kind === "rake"){
      const dx=b.x-p.x, dy=b.y-p.y;
      const ca=Math.cos(-p.dir), sa=Math.sin(-p.dir);
      const lx=dx*ca-dy*sa;
      const ly=dx*sa+dy*ca;
      hit = lx > 10 && lx < tool.reach && Math.abs(ly) < tool.width/2;
    }else{
      hit = distance(p.x,p.y,b.x,b.y) < tool.reach;
    }

    if(hit){
      game.balls.splice(i,1);
      p.carry += 1;
      game.points += 2;
      picked++;
      addParticle(b.x,b.y,"+2");
      if(tool.kind !== "roller" && picked >= Math.max(1,Math.floor(tool.cap/2))) break;
    }
  }
}

function addParticle(x,y,text){
  game.particles.push({x,y,text,life:0.8});
}

function buy(index){
  if(game.mode !== "shop") return;
  const item = tools[index];
  if(!item || game.tool >= index) return;
  if(game.points >= item.cost){
    game.points -= item.cost;
    game.tool = index;
    game.msg = item.name + "を購入！";
  }else{
    game.msg = "ポイント不足";
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawBackground();
  drawCourse();
  drawBalls();
  drawPros();
  drawPlayer();
  drawHUD();
  drawParticles();
  if(game.mode !== "play") drawOverlay();
}

function drawBackground(){
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#bfe4ff");
  sky.addColorStop(0.44,"#eaf7ff");
  sky.addColorStop(0.45,"#79b867");
  sky.addColorStop(1,"#2f7d3b");
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = "rgba(255,255,255,.55)";
  for(let i=0;i<7;i++){
    ctx.beginPath();
    ctx.ellipse(130+i*175,60+Math.sin(i)*16,95,23,0,0,Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle = "#5b6456";
  ctx.fillRect(430,180,330,58);
  ctx.fillStyle = "#2e332f";
  for(let i=0;i<12;i++) ctx.fillRect(445+i*25,192,12,14);
}

function drawCourse(){
  ctx.fillStyle = "#d3bd78";
  ctx.beginPath(); ctx.ellipse(215,340,130,35,-0.25,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(1040,350,120,36,0.25,0,Math.PI*2); ctx.fill();

  ctx.fillStyle = "#73c765";
  ctx.beginPath(); ctx.ellipse(675,405,535,235,0,0,Math.PI*2); ctx.fill();

  const green = ctx.createRadialGradient(640,360,70,675,405,540);
  green.addColorStop(0,"#a7de7b");
  green.addColorStop(1,"#5eaa52");
  ctx.fillStyle = green;
  ctx.beginPath(); ctx.ellipse(675,405,510,218,0,0,Math.PI*2); ctx.fill();

  ctx.strokeStyle = "rgba(255,255,255,.35)";
  ctx.lineWidth = 5;
  ctx.stroke();

  ctx.strokeStyle = "rgba(255,255,255,.13)";
  ctx.lineWidth = 2;
  for(let i=0;i<12;i++){
    ctx.beginPath();
    ctx.moveTo(180+i*85,230);
    ctx.lineTo(125+i*95,620);
    ctx.stroke();
  }

  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(990,246); ctx.lineTo(990,385); ctx.stroke();
  ctx.fillStyle = "#5dade2";
  ctx.beginPath(); ctx.moveTo(990,246); ctx.lineTo(1062,264); ctx.lineTo(990,282); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#eaffea";
  ctx.beginPath(); ctx.arc(990,385,9,0,Math.PI*2); ctx.fill();
}

function drawBalls(){
  for(const b of game.balls){
    ctx.fillStyle = "rgba(0,0,0,.16)";
    ctx.beginPath(); ctx.ellipse(b.x,b.y+4,7,3,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(b.x,b.y-b.z,5,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.18)";
    ctx.stroke();
  }
}

function drawPros(){
  for(const pro of game.pros){
    ctx.save();
    ctx.translate(pro.x,pro.y);

    ctx.fillStyle = "#8a4f25";
    roundRect(-36,26,72,34,7); ctx.fill();
    ctx.fillStyle = "#fff";
    for(let i=0;i<Math.min(12,pro.balls);i++){
      ctx.beginPath();
      ctx.arc(-27+(i%6)*11,34+Math.floor(i/6)*10,4,0,Math.PI*2);
      ctx.fill();
    }

    ctx.fillStyle = pro.color;
    ctx.fillRect(-13,-7,26,42);
    ctx.fillStyle = "#ffd6a5";
    ctx.beginPath(); ctx.arc(0,-23,15,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.fillRect(-18,-39,36,9);

    ctx.strokeStyle = "#333";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(12,10);
    ctx.lineTo(pro.swing>0 ? -48 : 44,42);
    ctx.stroke();

    ctx.fillStyle = pro.balls <= 5 ? "#e63946" : "#123";
    ctx.font = "bold 20px system-ui";
    ctx.textAlign = "center";
    ctx.fillText(pro.balls,0,82);
    ctx.restore();
  }
}

function drawPlayer(){
  const p = game.player;
  const tool = tools[game.tool];

  ctx.save();
  ctx.translate(p.x,p.y);

  if(tool.kind === "roller" || tool.kind === "rake"){
    ctx.save();
    ctx.rotate(p.dir);
    ctx.fillStyle = "rgba(255,255,255,.16)";
    ctx.fillRect(10,-tool.width/2,tool.reach,tool.width);
    ctx.restore();
  }else{
    ctx.fillStyle = "rgba(255,255,255,.15)";
    ctx.beginPath(); ctx.arc(0,0,tool.reach,0,Math.PI*2); ctx.fill();
  }

  ctx.fillStyle = "#ff7a00";
  ctx.fillRect(-14,-2,28,42);
  ctx.fillStyle = "#0b2447";
  ctx.fillRect(-16,-35,32,36);
  ctx.fillStyle = "#ffd6a5";
  ctx.beginPath(); ctx.arc(0,-48,14,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.fillRect(-20,-63,40,10);

  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(-8,40); ctx.lineTo(-14,60+Math.sin(p.walk)*5);
  ctx.moveTo(8,40); ctx.lineTo(14,60-Math.sin(p.walk)*5);
  ctx.stroke();

  drawTool(tool,p.dir);
  ctx.restore();

  ctx.fillStyle = "rgba(255,255,255,.92)";
  roundRect(p.x-50,p.y-100,100,30,14); ctx.fill();
  ctx.fillStyle = "#17331d";
  ctx.font = "bold 15px system-ui";
  ctx.textAlign = "center";
  ctx.fillText("持球 " + p.carry + "/" + tool.cap, p.x, p.y-80);
}

function drawTool(tool,dir){
  ctx.save();
  ctx.rotate(dir);
  if(tool.kind === "roller"){
    ctx.strokeStyle = "#0aa889";
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(6,5); ctx.lineTo(74,38);
    ctx.moveTo(6,5); ctx.lineTo(74,-38);
    ctx.stroke();

    ctx.fillStyle = "rgba(0,0,0,.75)";
    roundRect(58,-25,46,50,8); ctx.fill();

    ctx.strokeStyle = "#222";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(106,-23,15,0,Math.PI*2);
    ctx.arc(106,23,15,0,Math.PI*2);
    ctx.stroke();

    ctx.strokeStyle = "#0aa889";
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(112,-55); ctx.lineTo(170,-70);
    ctx.moveTo(112,55); ctx.lineTo(170,70);
    ctx.stroke();
  }else if(tool.kind === "rake"){
    ctx.strokeStyle = "#badc58";
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(95,0); ctx.stroke();
    for(let i=-4;i<=4;i++){
      ctx.beginPath(); ctx.moveTo(88,i*9); ctx.lineTo(112,i*9); ctx.stroke();
    }
  }else if(tool.kind === "tube"){
    ctx.strokeStyle = "#c7ecee";
    ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(65,0); ctx.stroke();
  }else{
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(38,0); ctx.stroke();
  }
  ctx.restore();
}

function drawHUD(){
  ctx.fillStyle = "rgba(255,255,255,.9)";
  roundRect(18,14,560,86,18); ctx.fill();
  ctx.fillStyle = "#17331d";
  ctx.font = "bold 22px system-ui";
  ctx.textAlign = "left";
  ctx.fillText("STAGE " + game.stage,38,47);
  ctx.fillText("POINT " + game.points,188,47);
  ctx.fillText("TIME " + Math.ceil(game.time),370,47);
  ctx.font = "15px system-ui";
  ctx.fillText("装備：" + tools[game.tool].name,38,78);

  ctx.fillStyle = "rgba(255,255,255,.9)";
  roundRect(W-380,14,362,86,18); ctx.fill();
  ctx.fillStyle = "#17331d";
  ctx.font = "bold 16px system-ui";
  ctx.fillText("誰か1人でも球が0になると終了",W-360,48);
  ctx.font = "14px system-ui";
  ctx.fillText("5秒に1球ずつアプローチ。拾って補充！",W-360,76);
}

function drawParticles(){
  ctx.textAlign = "center";
  ctx.font = "bold 18px system-ui";
  for(const p of game.particles){
    ctx.globalAlpha = Math.max(0,p.life/0.8);
    ctx.fillStyle = "#fff";
    ctx.fillText(p.text,p.x,p.y);
    ctx.globalAlpha = 1;
  }
}

function drawOverlay(){
  ctx.fillStyle = "rgba(0,0,0,.48)";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = "rgba(255,255,255,.96)";
  roundRect(W/2-335,H/2-205,670,410,28); ctx.fill();

  ctx.fillStyle = "#17331d";
  ctx.textAlign = "center";
  ctx.font = "bold 34px system-ui";
  const title = game.mode === "shop" ? "SHOP" : game.mode === "over" ? "GAME OVER" : "Approach Green Ball Picker";
  ctx.fillText(title,W/2,H/2-135);
  ctx.font = "20px system-ui";
  ctx.fillText(game.msg,W/2,H/2-92);

  if(game.mode === "shop"){
    ctx.textAlign = "left";
    ctx.font = "bold 18px system-ui";
    ctx.fillText("現在ポイント：" + game.points,W/2-270,H/2-48);
    for(let i=1;i<tools.length;i++){
      const item = tools[i];
      const owned = game.tool >= i;
      ctx.fillStyle = owned ? "#27ae60" : game.points >= item.cost ? "#17331d" : "#999";
      ctx.fillText(i + ". " + item.name + "　" + (owned ? "購入済み" : item.cost + "pt"),W/2-270,H/2+i*44-40);
    }
    ctx.fillStyle = "#17331d";
    ctx.textAlign = "center";
    ctx.font = "16px system-ui";
    ctx.fillText("数字キー1〜4で購入 / 画面下スタートで次ステージ",W/2,H/2+162);
  }else{
    ctx.fillStyle = "#17331d";
    roundRect(W/2-110,H/2-28,220,58,18); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 24px system-ui";
    ctx.fillText("START",W/2,H/2+10);
    ctx.font = "15px system-ui";
    ctx.fillStyle = "#17331d";
    ctx.fillText("画面をタップしても開始できます",W/2,H/2+70);
  }
}

function gameButtonAction(){
  if(game.mode === "play") return;
  if(game.mode === "title" || game.mode === "over"){
    resetGame();
    startStage();
  }else if(game.mode === "shop"){
    startStage();
  }
}

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05,(now-last)/1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

document.addEventListener("keydown", e => {
  keys[e.key] = true;
  if(["1","2","3","4"].includes(e.key)) buy(Number(e.key));
});
document.addEventListener("keyup", e => { keys[e.key] = false; });

document.getElementById("startBtn").addEventListener("click", gameButtonAction);
document.getElementById("startBtn").addEventListener("touchstart", function(e){e.preventDefault();gameButtonAction();}, {passive:false});

document.getElementById("shopBtn").addEventListener("click", function(){
  if(game.mode === "play") openShop();
  else if(game.mode === "shop") startStage();
});

document.getElementById("resetBtn").addEventListener("click", resetGame);

canvas.addEventListener("pointerdown", function(){
  if(game.mode !== "play") gameButtonAction();
});

document.querySelectorAll(".pad button").forEach(btn => {
  const dir = btn.dataset.dir;
  const on = e => { e.preventDefault(); mobile[dir]=true; };
  const off = e => { e.preventDefault(); mobile[dir]=false; };
  btn.addEventListener("pointerdown",on);
  btn.addEventListener("pointerup",off);
  btn.addEventListener("pointerleave",off);
  btn.addEventListener("pointercancel",off);
});

resetGame();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
