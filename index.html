<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WALK ART</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: #080810; color: #f0f0f8; overflow: hidden; }
body { font-family: 'Noto Sans JP', sans-serif; }

.screen { position: fixed; inset: 0; display: flex; flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.screen.hidden { display: none !important; }

/* ===== HOME ===== */
#sHome {
  background: #080810;
  align-items: center;
  justify-content: center;
  padding: 32px 24px;
  gap: 0;
}
#sHome::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 20%, rgba(99,102,241,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 80% 80%, rgba(6,182,212,0.08) 0%, transparent 60%);
  pointer-events: none;
}

.home-logo {
  font-family: 'Bebas Neue', cursive;
  font-size: 64px;
  letter-spacing: 0.12em;
  background: linear-gradient(135deg, #f0f0f8 30%, #818cf8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
  margin-bottom: 4px;
}
.home-sub {
  font-size: 12px;
  letter-spacing: 0.25em;
  color: #6b7280;
  text-transform: uppercase;
  margin-bottom: 40px;
}

.style-preview {
  width: 100%;
  max-width: 320px;
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 12px;
  border: 1px solid rgba(255,255,255,0.08);
  position: relative;
}
.style-preview-canvas {
  width: 100%;
  height: 160px;
  display: block;
}
.style-preview-info {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 12px 14px;
  background: linear-gradient(transparent, rgba(0,0,0,0.7));
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}
.style-preview-name {
  font-family: 'Bebas Neue', cursive;
  font-size: 20px;
  letter-spacing: 0.1em;
  color: #fff;
}
.btn-reroll {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 99px;
  color: #fff;
  font-size: 11px;
  padding: 4px 10px;
  cursor: pointer;
  font-family: 'Noto Sans JP', sans-serif;
  backdrop-filter: blur(8px);
}

.home-hint {
  font-size: 11px;
  color: #4b5563;
  text-align: center;
  margin-bottom: 24px;
  line-height: 1.6;
}

.btn-main {
  width: 100%;
  max-width: 320px;
  padding: 18px;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg, #6366f1, #06b6d4);
  color: #fff;
  font-family: 'Bebas Neue', cursive;
  font-size: 22px;
  letter-spacing: 0.15em;
  cursor: pointer;
  transition: transform 0.1s, opacity 0.2s;
  position: relative;
  z-index: 1;
}
.btn-main:active { transform: scale(0.97); }

/* ===== TRACKING ===== */
#sTracking {
  background: #080810;
  align-items: stretch;
}
.tracking-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px 8px;
  flex-shrink: 0;
}
.track-style-tag {
  font-family: 'Bebas Neue', cursive;
  font-size: 18px;
  letter-spacing: 0.12em;
  color: #818cf8;
}
.gps-status {
  font-size: 11px;
  color: #6b7280;
  display: flex;
  align-items: center;
  gap: 5px;
}
.gps-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #6b7280;
  flex-shrink: 0;
}
.gps-dot.active { background: #10b981; animation: blink 1.2s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

.canvas-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 16px;
  min-height: 0;
}
#artCanvas {
  border-radius: 16px;
  display: block;
  max-width: 100%;
  max-height: 100%;
}

.stats-row {
  display: flex;
  justify-content: space-around;
  padding: 12px 20px;
  border-top: 1px solid rgba(255,255,255,0.05);
  flex-shrink: 0;
}
.stat-item { text-align: center; }
.stat-num {
  font-family: 'Bebas Neue', cursive;
  font-size: 26px;
  letter-spacing: 0.05em;
  line-height: 1;
  color: #f0f0f8;
}
.stat-lbl {
  font-size: 10px;
  color: #6b7280;
  letter-spacing: 0.1em;
  margin-top: 2px;
}

.btn-stop {
  margin: 12px 20px 24px;
  padding: 16px;
  border: 1px solid rgba(239,68,68,0.4);
  border-radius: 14px;
  background: rgba(239,68,68,0.1);
  color: #f87171;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.2s;
}
.btn-stop:active { background: rgba(239,68,68,0.2); }

/* ===== RESULT ===== */
#sResult {
  background: #080810;
  align-items: stretch;
  padding-bottom: 40px;
}
.result-header {
  display: flex;
  align-items: center;
  padding: 16px 20px 8px;
  gap: 12px;
  flex-shrink: 0;
}
.btn-back {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.1);
  color: #9ca3af;
  font-size: 13px;
  padding: 7px 13px;
  border-radius: 99px;
  cursor: pointer;
  font-family: 'Noto Sans JP', sans-serif;
  white-space: nowrap;
}
.result-logo {
  font-family: 'Bebas Neue', cursive;
  font-size: 24px;
  letter-spacing: 0.12em;
  color: #818cf8;
}

.tabs {
  display: flex;
  margin: 0 20px 12px;
  background: rgba(255,255,255,0.04);
  border-radius: 10px;
  padding: 4px;
  gap: 4px;
  flex-shrink: 0;
}
.tab {
  flex: 1;
  padding: 9px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: #6b7280;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.tab.active { background: rgba(255,255,255,0.1); color: #f0f0f8; }

.result-canvas-wrap {
  padding: 0 16px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
#resultCanvas {
  border-radius: 16px;
  display: block;
  width: 100%;
  max-width: 420px;
}

.btn-save {
  width: 100%;
  max-width: 420px;
  padding: 14px;
  border: 1px solid rgba(99,102,241,0.4);
  border-radius: 13px;
  background: rgba(99,102,241,0.1);
  color: #818cf8;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.map-wrap {
  padding: 0 16px 8px;
  display: none;
}
.map-wrap.visible { display: block; }
#leafletMap {
  height: 320px;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.08);
}
.map-hint {
  text-align: center;
  font-size: 11px;
  color: #4b5563;
  margin-top: 8px;
  letter-spacing: 0.05em;
}

.result-stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin: 0 16px;
  flex-shrink: 0;
}
.rstat {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
  padding: 12px 8px;
  text-align: center;
}
.rval {
  font-family: 'Bebas Neue', cursive;
  font-size: 22px;
  letter-spacing: 0.05em;
  color: #c7d2fe;
  line-height: 1;
  margin-bottom: 4px;
}
.rlbl {
  font-size: 9px;
  color: #6b7280;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
</style>
</head>
<body>

<!-- HOME -->
<div id="sHome" class="screen">
  <div class="home-logo">WALK ART</div>
  <div class="home-sub">歩いた軌跡をアートに変換</div>
  <div class="style-preview" id="stylePreview">
    <canvas class="style-preview-canvas" id="previewCanvas" width="640" height="320"></canvas>
    <div class="style-preview-info">
      <div class="style-preview-name" id="previewName"></div>
      <button class="btn-reroll" onclick="rerollStyle()">🎲 スタイル変更</button>
    </div>
  </div>
  <div class="home-hint" style="margin-top:10px">
    スタートすると GPS で軌跡を記録します<br>屋外でお試しください 🌿
  </div>
  <button class="btn-main" onclick="startTracking()">🚶 記録スタート</button>
</div>

<!-- TRACKING -->
<div id="sTracking" class="screen hidden">
  <div class="tracking-top">
    <div class="track-style-tag" id="trackTag"></div>
    <div class="gps-status">
      <div class="gps-dot" id="gpsDot"></div>
      <span id="gpsLabel">GPS取得中...</span>
    </div>
  </div>
  <div class="canvas-wrap">
    <canvas id="artCanvas"></canvas>
  </div>
  <div class="stats-row">
    <div class="stat-item">
      <div class="stat-num" id="tDist">0m</div>
      <div class="stat-lbl">DISTANCE</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="tTime">00:00</div>
      <div class="stat-lbl">TIME</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="tPts">0</div>
      <div class="stat-lbl">POINTS</div>
    </div>
  </div>
  <button class="btn-stop" onclick="stopTracking()">⏹ 記録終了</button>
</div>

<!-- RESULT -->
<div id="sResult" class="screen hidden">
  <div class="result-header">
    <button class="btn-back" onclick="goHome()">← ホーム</button>
    <div class="result-logo">WALK ART</div>
  </div>
  <div class="tabs">
    <button class="tab active" id="tabArt" onclick="showTab('art')">🎨 アート</button>
    <button class="tab" id="tabMap" onclick="showTab('map')">🗺️ 地図</button>
  </div>
  <div class="result-canvas-wrap" id="artView">
    <canvas id="resultCanvas"></canvas>
    <button class="btn-save" onclick="saveArt()">📷 保存する（長押しで保存可）</button>
  </div>
  <div class="map-wrap" id="mapView">
    <div id="leafletMap"></div>
    <div class="map-hint">スクリーンショットで保存できます</div>
  </div>
  <div class="result-stats-grid">
    <div class="rstat"><div class="rval" id="rDist">—</div><div class="rlbl">距離</div></div>
    <div class="rstat"><div class="rval" id="rTime">—</div><div class="rlbl">時間</div></div>
    <div class="rstat"><div class="rval" id="rPts">—</div><div class="rlbl">ポイント</div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ===== STATE =====
const app = {
  style: null,
  points: [],
  watchId: null,
  startTime: null,
  distance: 0,
  timerInterval: null,
  leafletMap: null,
};

const STYLES = [
  {
    id: 'COSMOS',
    name: '🌌 COSMOS',
    bg: '#050510',
    pathColor: (t) => {
      const r = Math.round(t * 168);
      const g = Math.round(229 - t * 144);
      const b = 255;
      return `rgb(${r},${g},${b})`;
    },
    glow: '#00e5ff',
    markerStart: '#00ff88',
    markerEnd: '#ff3e6c',
  },
  {
    id: 'WATERCOLOR',
    name: '🎨 WATERCOLOR',
    bg: '#f5ede0',
    pathColor: (t) => {
      const colors = ['#d97706','#7c3aed','#059669','#dc2626','#2563eb'];
      return colors[Math.floor(t * (colors.length - 0.01))];
    },
    glow: null,
    markerStart: '#065f46',
    markerEnd: '#7f1d1d',
  },
  {
    id: 'GRADIENT',
    name: '🌈 GRADIENT',
    bg: '#000000',
    pathColor: (t) => `hsl(${t * 270}, 100%, 60%)`,
    glow: (t) => `hsl(${t * 270}, 100%, 60%)`,
    markerStart: '#00ff00',
    markerEnd: '#ff0000',
  },
  {
    id: 'MINIMAL',
    name: '⚡ MINIMAL',
    bg: '#f2f2f2',
    pathColor: () => '#111111',
    glow: null,
    markerStart: '#16a34a',
    markerEnd: '#dc2626',
  },
];

// ===== INIT =====
app.style = STYLES[Math.floor(Math.random() * STYLES.length)];
renderPreview();

function rerollStyle() {
  const idx = STYLES.indexOf(app.style);
  app.style = STYLES[(idx + 1) % STYLES.length];
  renderPreview();
}

// Draw a fake preview path for the home screen style card
function renderPreview() {
  document.getElementById('previewName').textContent = app.style.name;
  const canvas = document.getElementById('previewCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // Generate a fake walk path (sine wave-ish)
  const fakePts = [];
  for (let i = 0; i <= 60; i++) {
    const t = i / 60;
    fakePts.push({
      x: W * 0.1 + t * W * 0.8,
      y: H * 0.5 + Math.sin(t * Math.PI * 3) * H * 0.25 + Math.sin(t * Math.PI * 7) * H * 0.08,
    });
  }

  ctx.fillStyle = app.style.bg;
  ctx.fillRect(0, 0, W, H);

  if (app.style.id === 'COSMOS') {
    // Stars
    for (let i = 0; i < 40; i++) {
      ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.25+0.05})`;
      ctx.beginPath();
      ctx.arc(Math.random()*W, Math.random()*H, Math.random()*1.5, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.shadowBlur = 14;
    ctx.shadowColor = '#00e5ff';
  }

  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  for (let i = 1; i < fakePts.length; i++) {
    const t = i / fakePts.length;
    if (app.style.id === 'WATERCOLOR') {
      for (let pass = 0; pass < 2; pass++) {
        const hex = app.style.pathColor(t);
        ctx.strokeStyle = hex + (pass === 0 ? '22' : '44');
        ctx.lineWidth = pass === 0 ? 10 : 5;
        ctx.beginPath();
        ctx.moveTo(fakePts[i-1].x + (Math.random()-0.5)*3, fakePts[i-1].y + (Math.random()-0.5)*3);
        ctx.lineTo(fakePts[i].x + (Math.random()-0.5)*3, fakePts[i].y + (Math.random()-0.5)*3);
        ctx.stroke();
      }
    } else {
      if (app.style.id === 'GRADIENT') {
        ctx.shadowBlur = 8;
        ctx.shadowColor = app.style.pathColor(t);
      }
      ctx.strokeStyle = app.style.pathColor(t);
      ctx.lineWidth = app.style.id === 'MINIMAL' ? 2.5 : 2.5;
      ctx.beginPath();
      ctx.moveTo(fakePts[i-1].x, fakePts[i-1].y);
      ctx.lineTo(fakePts[i].x, fakePts[i].y);
      ctx.stroke();
    }
  }
  ctx.shadowBlur = 0;

  // Start/end dots
  ctx.fillStyle = app.style.markerStart;
  ctx.beginPath(); ctx.arc(fakePts[0].x, fakePts[0].y, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = app.style.markerEnd;
  ctx.beginPath(); ctx.arc(fakePts[fakePts.length-1].x, fakePts[fakePts.length-1].y, 5, 0, Math.PI*2); ctx.fill();
}

// ===== UTILS =====
function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function fmtDist(m) { return m >= 1000 ? (m/1000).toFixed(2)+'km' : Math.round(m)+'m'; }
function fmtTime(ms) {
  const m = Math.floor(ms/60000).toString().padStart(2,'0');
  const s = Math.floor((ms%60000)/1000).toString().padStart(2,'0');
  return `${m}:${s}`;
}
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

// ===== TRACKING =====
async function startTracking() {
  if (!navigator.geolocation) { alert('このブラウザはGPSに対応していません。'); return; }
  app.points = []; app.distance = 0; app.startTime = Date.now();
  document.getElementById('trackTag').textContent = app.style.name;
  show('sTracking');

  // Setup canvas
  const canvas = document.getElementById('artCanvas');
  const avail = Math.min(window.innerWidth - 32, window.innerHeight - 220);
  const size = Math.max(200, avail);
  canvas.style.width = size+'px'; canvas.style.height = size+'px';
  canvas.width = size * (window.devicePixelRatio || 2);
  canvas.height = size * (window.devicePixelRatio || 2);

  // Draw initial background
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = app.style.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (app.style.id === 'MINIMAL') drawGrid(ctx, canvas.width, canvas.height);

  // Timer
  app.timerInterval = setInterval(() => {
    document.getElementById('tTime').textContent = fmtTime(Date.now() - app.startTime);
  }, 1000);

  // GPS
  app.watchId = navigator.geolocation.watchPosition(onGPS, onGPSError,
    { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
}

function onGPS(pos) {
  const { latitude: lat, longitude: lng, accuracy } = pos.coords;
  document.getElementById('gpsDot').className = 'gps-dot active';
  document.getElementById('gpsLabel').textContent = `±${Math.round(accuracy)}m`;

  if (accuracy > 60) return;

  const last = app.points[app.points.length - 1];
  if (last) {
    const d = haversine(last.lat, last.lng, lat, lng);
    if (d < 2) return; // filter noise
    app.distance += d;
    document.getElementById('tDist').textContent = fmtDist(app.distance);
  }

  app.points.push({ lat, lng });
  document.getElementById('tPts').textContent = app.points.length;
  if (app.points.length >= 2) drawArtLive();
}

function onGPSError() {
  document.getElementById('gpsLabel').textContent = '取得失敗 ⚠️';
}

function stopTracking() {
  if (app.watchId !== null) { navigator.geolocation.clearWatch(app.watchId); app.watchId = null; }
  clearInterval(app.timerInterval);
  if (app.points.length < 2) {
    alert('記録点が少なすぎます。もう少し歩いてみてください。');
    show('sHome'); return;
  }
  showResult();
}

function goHome() {
  if (app.watchId !== null) { navigator.geolocation.clearWatch(app.watchId); app.watchId = null; }
  clearInterval(app.timerInterval);
  if (app.leafletMap) { app.leafletMap.remove(); app.leafletMap = null; }
  show('sHome');
}

// ===== ART DRAWING =====
function coordMapper(pts, W, H) {
  const pad = W * 0.1;
  const lats = pts.map(p=>p.lat), lngs = pts.map(p=>p.lng);
  const minLat=Math.min(...lats), maxLat=Math.max(...lats);
  const minLng=Math.min(...lngs), maxLng=Math.max(...lngs);
  const rW=maxLng-minLng||0.00001, rH=maxLat-minLat||0.00001;
  const dataAspect = rW/rH, canvasAspect = (W-pad*2)/(H-pad*2);
  let scale, offX=pad, offY=pad;
  if (dataAspect > canvasAspect) {
    scale = (W-pad*2)/rW; offY = (H - rH*scale)/2;
  } else {
    scale = (H-pad*2)/rH; offX = (W - rW*scale)/2;
  }
  return {
    x: (lng) => (lng-minLng)*scale + offX,
    y: (lat) => H - ((lat-minLat)*scale + offY),
  };
}

function drawGrid(ctx, W, H) {
  ctx.strokeStyle = 'rgba(0,0,0,0.05)';
  ctx.lineWidth = 0.5;
  const gs = W/12;
  for (let x=0; x<=W; x+=gs) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y=0; y<=H; y+=gs) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
}

function renderPath(ctx, pts, style, W, H, withStats, elapsed) {
  const m = coordMapper(pts, W, H);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  if (style.id === 'COSMOS') {
    // Starfield
    const seed = pts.length;
    for (let i=0; i<50; i++) {
      const sx = ((seed*i*7919+i*3571)%1000)/1000*W;
      const sy = ((seed*i*6271+i*4969)%1000)/1000*H;
      ctx.fillStyle = `rgba(255,255,255,${0.05+((i*17)%5)*0.04})`;
      ctx.beginPath(); ctx.arc(sx, sy, ((i%3)+0.5)*0.8, 0, Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur = 16;
    for (let i=1; i<pts.length; i++) {
      const t = i/pts.length;
      ctx.strokeStyle = style.pathColor(t);
      ctx.shadowColor = style.glow;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(m.x(pts[i-1].lng), m.y(pts[i-1].lat));
      ctx.lineTo(m.x(pts[i].lng),   m.y(pts[i].lat));
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    // Node dots (subsample)
    const step = Math.max(1, Math.floor(pts.length/24));
    for (let i=0; i<pts.length; i+=step) {
      const t=i/pts.length;
      ctx.shadowBlur=8; ctx.shadowColor='#a855f7';
      ctx.fillStyle='#a855f7';
      ctx.beginPath(); ctx.arc(m.x(pts[i].lng), m.y(pts[i].lat), 2.5, 0, Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur=0;

  } else if (style.id === 'WATERCOLOR') {
    for (let pass=0; pass<3; pass++) {
      for (let i=1; i<pts.length; i++) {
        const t=i/pts.length;
        const hex = style.pathColor(t);
        const alpha = [0.06, 0.10, 0.14][pass];
        ctx.strokeStyle = hex + Math.round(alpha*255).toString(16).padStart(2,'0');
        ctx.lineWidth = [12, 7, 3][pass];
        const ox=(Math.sin(i*13.7+pass)*2), oy=(Math.cos(i*7.3+pass)*2);
        ctx.beginPath();
        ctx.moveTo(m.x(pts[i-1].lng)+ox, m.y(pts[i-1].lat)+oy);
        ctx.lineTo(m.x(pts[i].lng)+ox,   m.y(pts[i].lat)+oy);
        ctx.stroke();
      }
    }
    // Clean center line
    ctx.strokeStyle='rgba(50,30,10,0.18)'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(m.x(pts[0].lng), m.y(pts[0].lat));
    for (let i=1; i<pts.length; i++) ctx.lineTo(m.x(pts[i].lng), m.y(pts[i].lat));
    ctx.stroke();

  } else if (style.id === 'GRADIENT') {
    ctx.shadowBlur=10;
    for (let i=1; i<pts.length; i++) {
      const t=i/pts.length;
      const c=style.pathColor(t);
      ctx.strokeStyle=c; ctx.shadowColor=c; ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(m.x(pts[i-1].lng), m.y(pts[i-1].lat));
      ctx.lineTo(m.x(pts[i].lng),   m.y(pts[i].lat));
      ctx.stroke();
    }
    ctx.shadowBlur=0;

  } else if (style.id === 'MINIMAL') {
    ctx.strokeStyle='#111'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(m.x(pts[0].lng), m.y(pts[0].lat));
    for (let i=1; i<pts.length; i++) ctx.lineTo(m.x(pts[i].lng), m.y(pts[i].lat));
    ctx.stroke();
    // Direction ticks (every 10 pts)
    ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=1;
    for (let i=5; i<pts.length-1; i+=Math.max(1,Math.floor(pts.length/15))) {
      const x1=m.x(pts[i].lng), y1=m.y(pts[i].lat);
      const x2=m.x(pts[i+1].lng), y2=m.y(pts[i+1].lat);
      const angle=Math.atan2(y2-y1, x2-x1);
      const px=x1+Math.cos(angle)*8, py=y1+Math.sin(angle)*8;
      ctx.beginPath();
      ctx.moveTo(px+Math.cos(angle+2.4)*5, py+Math.sin(angle+2.4)*5);
      ctx.lineTo(px, py);
      ctx.lineTo(px+Math.cos(angle-2.4)*5, py+Math.sin(angle-2.4)*5);
      ctx.stroke();
    }
  }

  // Start / End markers
  const sx=m.x(pts[0].lng), sy=m.y(pts[0].lat);
  const ex=m.x(pts[pts.length-1].lng), ey=m.y(pts[pts.length-1].lat);
  [
    [sx,sy,style.markerStart,7,'S'],
    [ex,ey,style.markerEnd,7,'E'],
  ].forEach(([x,y,color,r,label])=>{
    const isDark = ['COSMOS','GRADIENT'].includes(style.id);
    ctx.fillStyle=color;
    if (!isDark) { ctx.shadowBlur=0; }
    else { ctx.shadowBlur=14; ctx.shadowColor=color; }
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle= isDark ? 'rgba(255,255,255,0.8)' : 'rgba(0,0,0,0.6)';
    ctx.font = `bold ${W*0.022}px -apple-system, sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(label, x, y);
  });

  // Stats overlay
  if (withStats && elapsed!=null) {
    const isDark = ['COSMOS','GRADIENT'].includes(style.id);
    ctx.fillStyle = isDark ? 'rgba(0,0,0,0.45)' : 'rgba(255,255,255,0.6)';
    ctx.fillRect(0, H-W*0.09, W, W*0.09);
    ctx.fillStyle = isDark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.55)';
    ctx.font = `${W*0.028}px -apple-system, 'Noto Sans JP', sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const dist=app.distance, t=fmtTime(elapsed);
    ctx.fillText(`📍 ${fmtDist(dist)}  ⏱ ${t}  📌 ${pts.length}pts`, W/2, H-W*0.044);
  }
}

function drawArtLive() {
  const canvas=document.getElementById('artCanvas');
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.fillStyle=app.style.bg;
  ctx.fillRect(0,0,W,H);
  if (app.style.id==='MINIMAL') drawGrid(ctx,W,H);
  renderPath(ctx, app.points, app.style, W, H, false, null);
}

// ===== RESULT =====
function showResult() {
  show('sResult');
  const elapsed = Date.now()-app.startTime;
  document.getElementById('rDist').textContent = fmtDist(app.distance);
  document.getElementById('rTime').textContent = fmtTime(elapsed);
  document.getElementById('rPts').textContent = app.points.length;

  const canvas=document.getElementById('resultCanvas');
  const size=Math.min(window.innerWidth-32, 480);
  canvas.style.width=size+'px'; canvas.style.height=size+'px';
  canvas.width=size*2; canvas.height=size*2;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle=app.style.bg;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  if (app.style.id==='MINIMAL') drawGrid(ctx,canvas.width,canvas.height);
  renderPath(ctx, app.points, app.style, canvas.width, canvas.height, true, elapsed);

  showTab('art');
}

function showTab(tab) {
  document.getElementById('tabArt').classList.toggle('active', tab==='art');
  document.getElementById('tabMap').classList.toggle('active', tab==='map');
  document.getElementById('artView').style.display = tab==='art' ? 'flex' : 'none';
  document.getElementById('mapView').classList.toggle('visible', tab==='map');
  if (tab==='map' && !app.leafletMap) setTimeout(initLeaflet, 150);
}

function initLeaflet() {
  const lats=app.points.map(p=>p.lat), lngs=app.points.map(p=>p.lng);
  const center=[(Math.min(...lats)+Math.max(...lats))/2, (Math.min(...lngs)+Math.max(...lngs))/2];
  app.leafletMap = L.map('leafletMap',{zoomControl:true}).setView(center,16);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
    attribution:'© OpenStreetMap contributors, © CARTO', maxZoom:19
  }).addTo(app.leafletMap);
  const coords=app.points.map(p=>[p.lat,p.lng]);
  const poly=L.polyline(coords,{color:app.style.markerStart||'#00e5ff',weight:4,opacity:0.9}).addTo(app.leafletMap);
  app.leafletMap.fitBounds(poly.getBounds(),{padding:[40,40]});
  L.circleMarker(coords[0],{color:app.style.markerStart,radius:6,fillOpacity:1,fillColor:app.style.markerStart}).addTo(app.leafletMap);
  L.circleMarker(coords[coords.length-1],{color:app.style.markerEnd,radius:6,fillOpacity:1,fillColor:app.style.markerEnd}).addTo(app.leafletMap);
}

// ===== SAVE =====
function saveArt() {
  const canvas=document.getElementById('resultCanvas');
  const dataUrl=canvas.toDataURL('image/png');
  // iOS Safari: open in new tab, long-press to save
  const win=window.open('','_blank');
  if (!win) { alert('ポップアップをブロックされています。ブラウザの設定を確認してください。'); return; }
  win.document.write(`<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;}
img{max-width:100%;max-height:85vh;border-radius:12px;}
p{color:rgba(255,255,255,0.5);font-size:13px;font-family:-apple-system,sans-serif;text-align:center;}</style>
</head><body>
<img src="${dataUrl}">
<p>長押し → 写真に保存 / Android: 長押し → 画像を保存</p>
</body></html>`);
}
