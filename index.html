<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>音痴診断</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Dots&family=Noto+Sans+JP:wght@300;400;700&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #1e1e2e;
    --accent: #ff3e6c;
    --accent2: #00e5ff;
    --accent3: #ffd600;
    --text: #f0f0f5;
    --muted: #6b6b80;
    --good: #00e676;
    --warn: #ffab40;
    --bad: #ff3e6c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* bg grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 24px 20px 40px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Header */
  .header {
    text-align: center;
    padding-top: 8px;
  }
  .header-title {
    font-family: 'Zen Dots', cursive;
    font-size: 28px;
    letter-spacing: 0.05em;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  /* Big note display */
  .note-display {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    position: relative;
    overflow: hidden;
  }
  .note-display::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 140px; height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,62,108,0.1) 0%, transparent 70%);
    pointer-events: none;
  }
  .note-name {
    font-family: 'Zen Dots', cursive;
    font-size: 72px;
    line-height: 1;
    transition: color 0.15s;
    color: var(--accent2);
  }
  .note-name.no-sound { color: var(--muted); }
  .note-name.good { color: var(--good); }
  .note-name.warn { color: var(--warn); }
  .note-name.bad { color: var(--bad); }

  .freq-label {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }
  .freq-value {
    font-family: 'Zen Dots', cursive;
    font-size: 22px;
    color: var(--text);
    min-height: 28px;
  }

  /* Cents meter */
  .cents-bar-wrap {
    width: 100%;
    margin-top: 4px;
  }
  .cents-labels {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 4px;
    padding: 0 2px;
  }
  .cents-track {
    width: 100%;
    height: 10px;
    background: var(--border);
    border-radius: 99px;
    position: relative;
    overflow: hidden;
  }
  .cents-fill {
    position: absolute;
    top: 0; bottom: 0;
    border-radius: 99px;
    transition: left 0.1s, width 0.1s, background 0.2s;
    background: var(--accent2);
  }
  .cents-center {
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    width: 2px;
    background: rgba(255,255,255,0.3);
    transform: translateX(-50%);
  }
  .cents-value {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* Waveform */
  .waveform-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    overflow: hidden;
  }
  canvas#waveform {
    width: 100%;
    height: 60px;
    display: block;
    border-radius: 8px;
  }

  /* Score panel */
  .score-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
  }
  .score-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .score-label {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }
  .score-big {
    font-family: 'Zen Dots', cursive;
    font-size: 36px;
    background: linear-gradient(135deg, var(--accent3), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .score-rank {
    font-size: 13px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 99px;
    background: var(--border);
    color: var(--text);
    transition: background 0.3s, color 0.3s;
  }
  .score-rank.S { background: #ffd600; color: #0a0a0f; }
  .score-rank.A { background: #00e676; color: #0a0a0f; }
  .score-rank.B { background: #00e5ff; color: #0a0a0f; }
  .score-rank.C { background: #ff9100; color: #0a0a0f; }
  .score-rank.D { background: #ff3e6c; color: #fff; }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }
  .stat-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 6px;
    text-align: center;
  }
  .stat-val {
    font-family: 'Zen Dots', cursive;
    font-size: 18px;
    color: var(--accent2);
    display: block;
  }
  .stat-key {
    font-size: 9px;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.05em;
  }

  /* Diagnosis */
  .diagnosis {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    min-height: 52px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    transition: all 0.3s;
  }
  .diagnosis span.tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 99px;
    margin-right: 6px;
    letter-spacing: 0.05em;
  }
  .tag.good { background: var(--good); color: #0a0a0f; }
  .tag.warn { background: var(--warn); color: #0a0a0f; }
  .tag.bad  { background: var(--bad); color: #fff; }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 12px;
  }
  .btn {
    flex: 1;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
    letter-spacing: 0.05em;
  }
  .btn:active { transform: scale(0.97); }
  .btn-start {
    background: linear-gradient(135deg, var(--accent) 0%, #ff6b8a 100%);
    color: #fff;
  }
  .btn-reset {
    background: var(--border);
    color: var(--muted);
  }
  .btn:disabled { opacity: 0.4; cursor: default; }

  /* Listening indicator */
  .listening-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--bad);
    display: inline-block;
    margin-right: 6px;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }
  .status-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--muted);
    height: 20px;
    gap: 4px;
  }
  .status-bar.active { color: var(--bad); }

  /* History sparkline */
  canvas#sparkline {
    width: 100%;
    height: 36px;
    display: block;
  }
  .history-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px 8px;
  }
  .history-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-title">PITCH CHECK</div>
    <div class="header-sub">カラオケ 音痴診断</div>
  </div>

  <div class="status-bar" id="statusBar">マイクをオンにして診断スタート</div>

  <!-- Big note -->
  <div class="note-display">
    <div class="note-name no-sound" id="noteName">—</div>
    <div class="freq-label">検出周波数</div>
    <div class="freq-value" id="freqValue">— Hz</div>
    <div class="cents-bar-wrap">
      <div class="cents-labels"><span>♭ フラット</span><span>ぴったり</span><span>シャープ ♯</span></div>
      <div class="cents-track">
        <div class="cents-fill" id="centsFill" style="left:50%;width:0%"></div>
        <div class="cents-center"></div>
      </div>
      <div class="cents-value" id="centsValue">0 cents</div>
    </div>
  </div>

  <!-- Waveform -->
  <div class="waveform-wrap">
    <canvas id="waveform" width="760" height="120"></canvas>
  </div>

  <!-- Score -->
  <div class="score-panel">
    <div class="score-row">
      <div>
        <div class="score-label">スコア</div>
        <div class="score-big" id="scoreVal">100</div>
      </div>
      <div class="score-rank" id="rankBadge">—</div>
    </div>
    <div class="stat-grid">
      <div class="stat-box">
        <span class="stat-val" id="statGood">0</span>
        <div class="stat-key">ぴったり🎯</div>
      </div>
      <div class="stat-box">
        <span class="stat-val" id="statWarn">0</span>
        <div class="stat-key">ちょっとズレ</div>
      </div>
      <div class="stat-box">
        <span class="stat-val" id="statBad">0</span>
        <div class="stat-key">大きくズレ</div>
      </div>
    </div>
  </div>

  <!-- Sparkline -->
  <div class="history-wrap">
    <div class="history-label">PITCH ACCURACY HISTORY</div>
    <canvas id="sparkline" width="760" height="72"></canvas>
  </div>

  <!-- Diagnosis -->
  <div class="diagnosis" id="diagnosisBox">
    🎤 診断を開始すると、リアルタイムで音程の正確さを判定します。
  </div>

  <!-- Buttons -->
  <div class="btn-row">
    <button class="btn btn-start" id="btnStart" onclick="toggleListening()">🎤 診断スタート</button>
    <button class="btn btn-reset" id="btnReset" onclick="resetScore()">リセット</button>
  </div>

</div>

<script>
// ===== Web Audio API setup =====
let audioCtx, analyser, micStream, animFrame;
let isListening = false;
let dataArray, bufferLength;

// Score tracking
let goodCount = 0, warnCount = 0, badCount = 0;
let totalSampled = 0;
let centHistory = []; // -50 to +50 or null
const MAX_HISTORY = 80;

// Note table
const NOTES_EN = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTES_JP = ['ド','ド♯','レ','レ♯','ミ','ファ','ファ♯','ソ','ソ♯','ラ','ラ♯','シ'];

function freqToNote(freq) {
  if (freq <= 0) return null;
  const semitones = 12 * Math.log2(freq / 440);
  const midi = Math.round(semitones) + 69;
  const octave = Math.floor(midi / 12) - 1;
  const noteIdx = ((midi % 12) + 12) % 12;
  const exactSemitones = 12 * Math.log2(freq / 440) + 69;
  const cents = Math.round((exactSemitones - midi) * 100);
  return { name: NOTES_JP[noteIdx], en: NOTES_EN[noteIdx], octave, cents, midi };
}

// Autocorrelation pitch detection (YIN-lite)
function getPitch(buf, sampleRate) {
  const SIZE = buf.length;
  const MAX_SAMPLES = Math.floor(SIZE / 2);
  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.01) return -1; // silence

  const corr = new Float32Array(MAX_SAMPLES);
  for (let lag = 0; lag < MAX_SAMPLES; lag++) {
    for (let i = 0; i < MAX_SAMPLES; i++) {
      corr[lag] += buf[i] * buf[i + lag];
    }
  }
  let d = 0;
  while (d < MAX_SAMPLES && corr[d] > corr[d + 1]) d++;
  let maxVal = -1, maxPos = -1;
  for (let i = d; i < MAX_SAMPLES; i++) {
    if (corr[i] > maxVal) { maxVal = corr[i]; maxPos = i; }
  }
  if (maxPos < 2) return -1;
  // Parabolic interpolation
  const y1 = corr[maxPos - 1], y2 = corr[maxPos], y3 = corr[maxPos + 1] || 0;
  const refined = maxPos - (y3 - y1) / (2 * (2 * y2 - y1 - y3));
  const freq = sampleRate / refined;
  if (freq < 60 || freq > 1200) return -1;
  return freq;
}

// ===== Canvas refs =====
const waveCanvas = document.getElementById('waveform');
const wCtx = waveCanvas.getContext('2d');
const sparkCanvas = document.getElementById('sparkline');
const sCtx = sparkCanvas.getContext('2d');

function drawWaveform(timeDomain) {
  const W = waveCanvas.width, H = waveCanvas.height;
  wCtx.clearRect(0, 0, W, H);
  wCtx.fillStyle = '#0e0e16';
  wCtx.fillRect(0, 0, W, H);

  wCtx.lineWidth = 2;
  const grad = wCtx.createLinearGradient(0, 0, W, 0);
  grad.addColorStop(0, '#ff3e6c');
  grad.addColorStop(0.5, '#00e5ff');
  grad.addColorStop(1, '#ff3e6c');
  wCtx.strokeStyle = grad;
  wCtx.beginPath();
  const sliceWidth = W / timeDomain.length;
  let x = 0;
  for (let i = 0; i < timeDomain.length; i++) {
    const v = timeDomain[i] / 128;
    const y = (v * H) / 2;
    i === 0 ? wCtx.moveTo(x, y) : wCtx.lineTo(x, y);
    x += sliceWidth;
  }
  wCtx.stroke();
}

function drawSparkline() {
  const W = sparkCanvas.width, H = sparkCanvas.height;
  sCtx.clearRect(0, 0, W, H);
  sCtx.fillStyle = '#0e0e16';
  sCtx.fillRect(0, 0, W, H);

  // center line
  sCtx.strokeStyle = 'rgba(255,255,255,0.08)';
  sCtx.lineWidth = 1;
  sCtx.beginPath();
  sCtx.moveTo(0, H / 2);
  sCtx.lineTo(W, H / 2);
  sCtx.stroke();

  if (centHistory.length < 2) return;
  const step = W / MAX_HISTORY;
  sCtx.lineWidth = 2;
  sCtx.beginPath();
  let started = false;
  for (let i = 0; i < centHistory.length; i++) {
    const c = centHistory[i];
    if (c === null) { started = false; continue; }
    const x = i * step;
    const y = H / 2 - (c / 50) * (H / 2 - 4);
    // color by cents
    const absC = Math.abs(c);
    if (absC <= 15) sCtx.strokeStyle = '#00e676';
    else if (absC <= 30) sCtx.strokeStyle = '#ffab40';
    else sCtx.strokeStyle = '#ff3e6c';

    if (!started) { sCtx.moveTo(x, y); started = true; }
    else { sCtx.lineTo(x, y); sCtx.stroke(); sCtx.beginPath(); sCtx.moveTo(x, y); }
  }
}

// ===== UI update =====
function updateUI(freq, noteInfo) {
  const noteName = document.getElementById('noteName');
  const freqVal = document.getElementById('freqValue');
  const centsFill = document.getElementById('centsFill');
  const centsVal = document.getElementById('centsValue');

  if (!noteInfo || freq < 0) {
    noteName.textContent = '—';
    noteName.className = 'note-name no-sound';
    freqVal.textContent = '— Hz';
    centsFill.style.left = '50%';
    centsFill.style.width = '0%';
    centsFill.style.background = 'var(--accent2)';
    centsVal.textContent = '0 cents';
    centHistory.push(null);
  } else {
    const c = noteInfo.cents;
    const absC = Math.abs(c);
    let cls = 'note-name';
    let color = 'var(--accent2)';
    if (absC <= 15) { cls += ' good'; color = 'var(--good)'; }
    else if (absC <= 30) { cls += ' warn'; color = 'var(--warn)'; }
    else { cls += ' bad'; color = 'var(--bad)'; }
    noteName.textContent = noteInfo.name;
    noteName.className = cls;
    freqVal.textContent = freq.toFixed(1) + ' Hz';
    // Cents bar: center=50%, range ±50cents → ±50% of half
    const pct = (c / 50) * 50; // -50 to +50
    if (c >= 0) {
      centsFill.style.left = '50%';
      centsFill.style.width = Math.abs(pct) + '%';
    } else {
      centsFill.style.left = (50 + pct) + '%';
      centsFill.style.width = Math.abs(pct) + '%';
    }
    centsFill.style.background = color;
    centsVal.textContent = (c >= 0 ? '+' : '') + c + ' cents';

    // Update counts
    totalSampled++;
    if (absC <= 15) goodCount++;
    else if (absC <= 30) warnCount++;
    else badCount++;

    centHistory.push(Math.max(-50, Math.min(50, c)));
    updateScore();
    updateDiagnosis(c, absC);
  }
  if (centHistory.length > MAX_HISTORY) centHistory.shift();
  drawSparkline();
  updateStatUI();
}

function updateStatUI() {
  document.getElementById('statGood').textContent = goodCount;
  document.getElementById('statWarn').textContent = warnCount;
  document.getElementById('statBad').textContent = badCount;
}

function updateScore() {
  if (totalSampled === 0) return;
  const score = Math.round(100 * (goodCount + warnCount * 0.5) / totalSampled);
  document.getElementById('scoreVal').textContent = score;
  const rank = score >= 90 ? 'S' : score >= 75 ? 'A' : score >= 60 ? 'B' : score >= 45 ? 'C' : 'D';
  const badge = document.getElementById('rankBadge');
  badge.textContent = rank;
  badge.className = 'score-rank ' + rank;
}

let lastDiagTime = 0;
function updateDiagnosis(cents, absCents) {
  const now = Date.now();
  if (now - lastDiagTime < 1500) return;
  lastDiagTime = now;
  const box = document.getElementById('diagnosisBox');
  if (absCents <= 10) {
    box.innerHTML = '<span class="tag good">完璧！</span>音程バッチリです🎯 この調子でキープ！';
  } else if (absCents <= 20) {
    box.innerHTML = '<span class="tag good">ほぼOK</span>' + (cents > 0 ? 'わずかに高め。' : 'わずかに低め。') + 'もう少しで完璧！';
  } else if (absCents <= 35) {
    box.innerHTML = '<span class="tag warn">ちょいズレ</span>' + (cents > 0 ? '少し音が高いです🎵' : '少し音が低いです🎵') + ' 意識して調整してみて';
  } else {
    box.innerHTML = '<span class="tag bad">ズレてる！</span>' + (cents > 0 ? '音が高すぎ⬆️' : '音が低すぎ⬇️') + ' カラオケ練習あるのみ！💦';
  }
}

// ===== Mic loop =====
function loop() {
  if (!isListening) return;
  animFrame = requestAnimationFrame(loop);

  const timeDomain = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(timeDomain);
  drawWaveform(timeDomain);

  const floatBuf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(floatBuf);
  const freq = getPitch(floatBuf, audioCtx.sampleRate);
  const noteInfo = freq > 0 ? freqToNote(freq) : null;
  updateUI(freq, noteInfo);
}

// ===== Toggle =====
async function toggleListening() {
  if (isListening) {
    stopListening();
  } else {
    await startListening();
  }
}

async function startListening() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    const src = audioCtx.createMediaStreamSource(micStream);
    src.connect(analyser);
    bufferLength = analyser.fftSize;
    dataArray = new Uint8Array(bufferLength);

    isListening = true;
    document.getElementById('btnStart').textContent = '⏹ 診断ストップ';
    document.getElementById('btnStart').style.background = 'linear-gradient(135deg, #333 0%, #555 100%)';

    const sb = document.getElementById('statusBar');
    sb.innerHTML = '<span class="listening-dot"></span>聴き取り中...';
    sb.className = 'status-bar active';

    loop();
  } catch (e) {
    alert('マイクへのアクセスを許可してください。');
  }
}

function stopListening() {
  isListening = false;
  cancelAnimationFrame(animFrame);
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();

  document.getElementById('btnStart').textContent = '🎤 診断スタート';
  document.getElementById('btnStart').style.background = 'linear-gradient(135deg, var(--accent) 0%, #ff6b8a 100%)';
  document.getElementById('statusBar').textContent = '診断停止中';
  document.getElementById('statusBar').className = 'status-bar';
  document.getElementById('noteName').textContent = '—';
  document.getElementById('noteName').className = 'note-name no-sound';
  document.getElementById('freqValue').textContent = '— Hz';
}

function resetScore() {
  goodCount = 0; warnCount = 0; badCount = 0; totalSampled = 0;
  centHistory = [];
  document.getElementById('scoreVal').textContent = '100';
  document.getElementById('rankBadge').textContent = '—';
  document.getElementById('rankBadge').className = 'score-rank';
  updateStatUI();
  drawSparkline();
  document.getElementById('diagnosisBox').textContent = '🎤 診断を開始すると、リアルタイムで音程の正確さを判定します。';
