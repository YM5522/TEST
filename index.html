<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ボール選択アンケート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column, question cards stacked, send button pinned in flow at the end */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --fg: #1b231d;
  --muted: #5e6b61;
  --line: #d6ddd7;
  --accent: #1f6b45;
  --accent-ink: #ffffff;
  --accent-soft: #e3efe7;
  --send: #06a64f;
  --font-display: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121714; --surface: #1b221e; --fg: #e6ece7; --muted: #9aa79e;
    --line: #2e3832; --accent: #5fbf8a; --accent-ink: #0d1510; --accent-soft: #213128;
    --send: #22b862; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121714; --surface: #1b221e; --fg: #e6ece7; --muted: #9aa79e;
  --line: #2e3832; --accent: #5fbf8a; --accent-ink: #0d1510; --accent-soft: #213128;
  --send: #22b862; color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
}
.wrap {
  max-width: 480px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
  display: flex; flex-direction: column; gap: 18px;
}
header { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--accent); font-weight: 700; }
h1 { font-family: var(--font-display); font-size: 26px; line-height: 1.3; margin: 0; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); font-size: 14px; }

.q {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 18px; display: flex; flex-direction: column; gap: 12px;
}
.q-label { display: flex; align-items: baseline; gap: 10px; }
.q-num { font-family: var(--font-display); font-weight: 700; color: var(--accent); font-size: 14px; }
.q-text { font-weight: 700; font-size: 16px; }

input[type="text"] {
  width: 100%; box-sizing: border-box; font: inherit; color: var(--fg);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px; font-size: 16px;
}
input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }

.choices { display: grid; gap: 10px; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.choice span {
  display: flex; align-items: center; gap: 12px;
  border: 1px solid var(--line); border-radius: 10px; padding: 14px;
  font-weight: 700; font-family: var(--font-display); font-size: 18px; letter-spacing: .02em;
  background: var(--bg); transition: background .15s, border-color .15s;
}
.choice span::before {
  content: ""; width: 18px; height: 18px; border-radius: 50%; flex: none;
  border: 2px solid var(--line); box-sizing: border-box; background: var(--surface);
}
.choice input:checked + span { border-color: var(--accent); background: var(--accent-soft); }
.choice input:checked + span::before { border: 6px solid var(--accent); }
.choice input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.preview {
  border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px;
  font-size: 14px; color: var(--muted); white-space: pre-wrap; margin: 0;
  font-family: var(--font-body);
}
.send {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  text-decoration: none; font-weight: 700; font-size: 17px;
  background: var(--send); color: #ffffff; border-radius: 999px; padding: 16px;
  transition: opacity .15s;
}
.send[aria-disabled="true"] { opacity: .35; pointer-events: none; }
.send:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.hint { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>body{margin:0}</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">BALL SURVEY</div>
    <h1>使用ボールのアンケート</h1>
    <p class="lead">2問だけです。回答したら下のボタンからLINEで担当者に送ってください。</p>
  </header>

  <form id="form" class="wrap-inner" style="display:flex;flex-direction:column;gap:18px" novalidate>
    <section class="q">
      <label class="q-label" for="name"><span class="q-num">問1</span><span class="q-text">名前を入力してください</span></label>
      <input type="text" id="name" name="name" placeholder="例：山田 太郎" autocomplete="name">
    </section>

    <section class="q" role="radiogroup" aria-labelledby="q2">
      <div class="q-label" id="q2"><span class="q-num">問2</span><span class="q-text">ボールを選んでください</span></div>
      <div class="choices">
        <label class="choice"><input type="radio" id="ball-x" name="ball" value="TOUR B X"><span>TOUR B X</span></label>
        <label class="choice"><input type="radio" id="ball-xs" name="ball" value="TOUR B XS"><span>TOUR B XS</span></label>
      </div>
    </section>

    <pre class="preview" id="preview" aria-live="polite"></pre>

    <a class="send" id="send" href="#" target="_blank" rel="noopener" aria-disabled="true">LINEで送る</a>
    <p class="hint" id="hint">名前とボールを入力するとボタンが押せます</p>
  </form>
</div>

<script>
(function () {
  var form = document.getElementById('form');
  var nameEl = document.getElementById('name');
  var send = document.getElementById('send');
  var preview = document.getElementById('preview');
  var hint = document.getElementById('hint');

  function buildText(name, ball) {
    return '【ボールアンケート回答】\n名前：' + name + '\nボール：' + ball;
  }

  function update() {
    var name = nameEl.value.trim();
    var checked = form.querySelector('input[name="ball"]:checked');
    var ball = checked ? checked.value : '';
    var ready = name !== '' && ball !== '';
    preview.textContent = buildText(name || '（未入力）', ball || '（未選択）');
    if (ready) {
      send.href = 'https://line.me/R/share?text=' + encodeURIComponent(buildText(name, ball));
      send.setAttribute('aria-disabled', 'false');
      hint.textContent = 'タップするとLINEが開きます。担当者を選んで送信してください';
    } else {
      send.href = '#';
      send.setAttribute('aria-disabled', 'true');
      hint.textContent = '名前とボールを入力するとボタンが押せます';
    }
  }

  form.addEventListener('input', update);
  form.addEventListener('change', update);
  form.addEventListener('submit', function (e) { e.preventDefault(); });
  update();
})();
</script>
</body>
</html>
