<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>WEATHER STACK</title>
<meta name="theme-color" content="#0A1420">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weather Stack">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
:root{
  --bg:#0A1420;
  --bg-card:#101E33;
  --bg-card2:#16283F;
  --line:rgba(255,255,255,0.07);
  --accent:#4FA8FF;
  --accent-dim:rgba(79,168,255,0.16);
  --text:#EAF2FF;
  --text-dim:#8CA3C4;
  --text-faint:#5C7290;
  --danger:#FF5C5C;
  --radius:20px;
  --safe-top:env(safe-area-inset-top, 0px);
  --safe-bottom:env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
  font-family:"Noto Sans JP","Hiragino Sans",system-ui,-apple-system,sans-serif;
  overscroll-behavior-y:contain;
}
body{ padding-bottom: calc(24px + var(--safe-bottom)); min-height:100vh;}
.num{font-family:"Space Grotesk", sans-serif; font-variant-numeric:tabular-nums;}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:20;
  padding: calc(14px + var(--safe-top)) 18px 12px;
  background:linear-gradient(180deg, var(--bg) 60%, rgba(10,20,32,0.85) 90%, transparent);
  backdrop-filter:blur(10px);
  display:flex; align-items:center; justify-content:space-between;
}
.brand{display:flex; flex-direction:column; gap:2px;}
.brand .title{font-family:"Space Grotesk", sans-serif; font-weight:700; font-size:16px; letter-spacing:0.01em; white-space:nowrap;}
.brand .place{font-size:12px; color:var(--text-dim);}
.icon-btn{
  width:38px; height:38px; border-radius:12px; border:1px solid var(--line);
  background:var(--bg-card); color:var(--text); display:flex; align-items:center; justify-content:center;
  font-size:18px;
}
#doneBtn{
  display:none; background:var(--accent); color:#06121F; font-weight:700; font-size:13px;
  padding:8px 16px; border-radius:12px; border:none;
}
#doneBtn.show{display:block;}
#editBtn.hide{display:none;}

/* ---------- grid ---------- */
main{padding: 4px 14px 10px;}
#grid{
  display:grid; grid-template-columns:1fr 1fr; gap:12px;
  list-style:none; margin:0; padding:0;
}
.card{
  position:relative;
  background:var(--bg-card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px 12px 12px;
  aspect-ratio:1/1;
  display:flex; flex-direction:column; justify-content:flex-start;
  transition:transform .15s ease;
  overflow:hidden;
}
.card .label{font-size:11.5px; color:var(--text-dim); display:flex; align-items:center; gap:6px;}
.card .label .dot{width:6px;height:6px;border-radius:50%;background:var(--accent); flex:0 0 auto;}
.card .value{font-size:28px; font-weight:600; line-height:1.1; margin-top:auto;}
.card .value .unit{font-size:13px; font-weight:500; color:var(--text-dim); margin-left:2px;}
.card .sub{font-size:11.5px; color:var(--text-faint); margin-top:4px;}
.card[data-tap="1"]{cursor:pointer;}
.tap-hint{position:absolute; right:12px; top:14px; font-size:11px; color:var(--text-faint);}

/* edit mode */
body.editing .card{ animation:wobble 0.28s ease-in-out infinite alternate; }
body.editing .card.dragging-ghost{ animation:none; opacity:0.4; }
@keyframes wobble{ from{transform:rotate(-0.6deg);} to{transform:rotate(0.6deg);} }
.del-btn{
  display:none; position:absolute; top:-7px; left:-7px; width:24px; height:24px;
  border-radius:50%; background:var(--danger); color:#fff; border:2px solid var(--bg);
  align-items:center; justify-content:center; font-size:14px; font-weight:700; z-index:5;
}
body.editing .del-btn{display:flex;}
.add-tile{
  border:1.5px dashed var(--line); background:transparent; border-radius:var(--radius);
  aspect-ratio:1/1;
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px;
  color:var(--text-dim); font-size:12px;
}
.add-tile .plus{font-size:26px; color:var(--accent);}

/* ---------- compass ---------- */
.compass-wrap{display:flex; flex-direction:column; align-items:center; gap:2px; margin-top:auto; width:100%;}
.compass{position:relative; width:58px; height:58px; flex:0 0 auto;}
.compass svg{width:100%; height:100%; display:block;}
.compass .needle{transform-origin:50% 50%; transition:transform .6s cubic-bezier(.4,1.4,.5,1);}
.compass-data{display:flex; flex-direction:column; align-items:center; margin-top:2px;}
.compass-data .spd{font-size:20px; font-weight:600; line-height:1;}
.compass-data .dir{font-size:10.5px; color:var(--text-dim); margin-top:2px; text-align:center;}

/* ---------- sun card ---------- */
.sun-col{display:flex; flex-direction:column; gap:8px; margin-top:auto; width:100%;}
.sun-col .row{display:flex; align-items:center; gap:6px;}
.sun-col .ic{font-size:15px;}
.sun-col .t{font-size:16px; font-weight:600;}
.sun-col .l{font-size:10.5px; color:var(--text-dim); margin-left:auto;}

/* ---------- weekly (compact tile summary) ---------- */
.weekly-mini{display:flex; align-items:center; justify-content:space-between; margin-top:auto; width:100%;}
.weekly-mini .ic{font-size:26px;}
.weekly-mini .range{display:flex; flex-direction:column; align-items:flex-end;}
.weekly-mini .hi{font-size:18px; font-weight:600;}
.weekly-mini .lo{font-size:12px; color:var(--text-faint);}

/* ---------- weekly detail sheet ---------- */
.weekly-detail-row{
  display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid var(--line);
}
.weekly-detail-row .d{width:38px; font-size:13px; color:var(--text-dim);}
.weekly-detail-row .ic{width:28px; font-size:18px; text-align:center;}
.weekly-detail-row .pp{width:44px; font-size:11.5px; color:var(--accent); text-align:right;}
.weekly-detail-row .temps{flex:1; display:flex; align-items:center; gap:8px; justify-content:flex-end;}
.weekly-detail-row .hi{font-size:14px; font-weight:600;}
.weekly-detail-row .lo{font-size:13px; color:var(--text-faint);}

/* ---------- sheet (add card panel) ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s;
}
.overlay.show{opacity:1; pointer-events:auto;}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:41;
  background:var(--bg-card2); border-radius:22px 22px 0 0;
  padding:16px 18px calc(20px + var(--safe-bottom));
  transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1);
  max-height:70vh; overflow-y:auto;
}
.sheet.show{transform:translateY(0);}
.sheet h3{margin:4px 0 12px; font-size:15px; font-weight:700;}
.sheet-item{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 4px; border-bottom:1px solid var(--line); font-size:14px;
}
.sheet-item button{
  background:var(--accent-dim); color:var(--accent); border:none; border-radius:10px;
  padding:6px 14px; font-size:13px; font-weight:600;
}
.sheet-empty{color:var(--text-dim); font-size:13px; padding:18px 4px; text-align:center;}

/* ---------- status / loading ---------- */
#status{
  margin:0 14px 10px; padding:10px 14px; border-radius:14px; background:var(--bg-card);
  color:var(--text-dim); font-size:12.5px; display:none; align-items:center; gap:8px;
}
#status.show{display:flex;}
.spin{width:14px; height:14px; border-radius:50%; border:2px solid var(--text-faint); border-top-color:var(--accent); animation:spin 0.8s linear infinite; flex:0 0 auto;}
@keyframes spin{to{transform:rotate(360deg);}}
#refreshBtn{background:none; border:none; color:var(--accent); font-size:12.5px; margin-left:auto; font-weight:600;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="title">WEATHER STACK</div>
    <div class="place" id="placeLabel">位置情報を取得中…</div>
  </div>
  <div style="display:flex; gap:8px; align-items:center;">
    <button id="doneBtn">完了</button>
    <button id="editBtn" class="icon-btn" aria-label="編集">⚙︎</button>
  </div>
</header>

<div id="status"><span class="spin"></span><span id="statusText">データを取得しています…</span><button id="refreshBtn">再取得</button></div>

<main>
  <ul id="grid"></ul>
</main>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <h3>カードを追加</h3>
  <div id="sheetList"></div>
</div>
<div class="sheet" id="weeklySheet">
  <h3>週間予報</h3>
  <div id="weeklyList"></div>
</div>

<script>
/* ========================= 設定 / カード定義 ========================= */
const ALL_CARDS = [
  {id:'wind',      label:'風向・風速'},
  {id:'gust',      label:'突風'},
  {id:'temp',      label:'気温'},
  {id:'feels',     label:'体感温度'},
  {id:'humidity',  label:'湿度'},
  {id:'elevation', label:'標高'},
  {id:'precipProb',label:'降水確率'},
  {id:'precip',    label:'降水量'},
  {id:'cloud',     label:'雲量'},
  {id:'pressure',  label:'気圧'},
  {id:'sun',       label:'日の出・日没'},
  {id:'uv',        label:'UV指数'},
  {id:'weekly',    label:'週間予報'},
];
const TAPPABLE = ['weekly'];
const CARD_MAP = Object.fromEntries(ALL_CARDS.map(c=>[c.id,c]));
const DEFAULT_ORDER = ['wind','temp','humidity','precipProb','sun','weekly','elevation','gust','uv','pressure','cloud','precip','feels'];
const DEFAULT_ENABLED = ALL_CARDS.map(c => c.id);

const STORE_KEY = 'gc_conditions_settings_v1';
function loadSettings(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) throw 0;
    const s = JSON.parse(raw);
    if(!Array.isArray(s.order) || !Array.isArray(s.enabled)) throw 0;
    // include any newly-added card ids not yet known to this user
    ALL_CARDS.forEach(c=>{ if(!s.order.includes(c.id)) s.order.push(c.id); });
    return s;
  }catch(e){
    return {order:[...DEFAULT_ORDER], enabled:[...DEFAULT_ENABLED]};
  }
}
function saveSettings(){
  localStorage.setItem(STORE_KEY, JSON.stringify(settings));
}
let settings = loadSettings();

/* ========================= 状態 ========================= */
let weatherData = null;
let editing = false;
let sortable = null;

/* ========================= DOM ========================= */
const grid = document.getElementById('grid');
const editBtn = document.getElementById('editBtn');
const doneBtn = document.getElementById('doneBtn');
const overlay = document.getElementById('overlay');
const sheet = document.getElementById('sheet');
const sheetList = document.getElementById('sheetList');
const weeklySheet = document.getElementById('weeklySheet');
const weeklyList = document.getElementById('weeklyList');
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
const placeLabel = document.getElementById('placeLabel');

/* ========================= 天気コード → 表示 ========================= */
function weatherIcon(code){
  if(code===0) return '☀️';
  if([1,2].includes(code)) return '🌤️';
  if(code===3) return '☁️';
  if([45,48].includes(code)) return '🌫️';
  if([51,53,55,56,57].includes(code)) return '🌦️';
  if([61,63,65,66,67,80,81,82].includes(code)) return '🌧️';
  if([71,73,75,77,85,86].includes(code)) return '🌨️';
  if([95,96,99].includes(code)) return '⛈️';
  return '☁️';
}
const DIRS = ['北','北北東','北東','東北東','東','東南東','南東','南南東','南','南南西','南西','西南西','西','西北西','北西','北北西'];
function dirLabel(deg){ return DIRS[Math.round(deg/22.5)%16]; }
function fmtDay(dateStr, idx){
  const d = new Date(dateStr+'T00:00:00');
  if(idx===0) return '今日';
  return ['日','月','火','水','木','金','土'][d.getDay()]+'曜';
}

/* ========================= カード描画 ========================= */
function cardShell(id, label, bodyHtml){
  const tappable = TAPPABLE.includes(id);
  return `<li class="card" data-id="${id}" data-tap="${tappable?1:0}">
    <button class="del-btn" data-del="${id}">✕</button>
    <div class="label"><span class="dot"></span>${label}</div>
    ${tappable ? '<span class="tap-hint">›</span>' : ''}
    ${bodyHtml}
  </li>`;
}

function renderCardBody(id){
  const w = weatherData;
  if(!w) return `<div class="value num" style="color:var(--text-faint); font-size:16px;">--</div>`;
  const cur = w.current, daily = w.daily;

  switch(id){
    case 'wind': {
      const spd = cur.wind_speed_10m, dir = cur.wind_direction_10m;
      const arrowDeg = dir + 180; // 吹いていく方向を指す
      return `<div class="compass-wrap">
        <div class="compass">
          <svg viewBox="0 0 74 74">
            <circle cx="37" cy="37" r="32" fill="none" stroke="#22344c" stroke-width="2"/>
            <g stroke="#3a4f6b" stroke-width="1.5">
              <line x1="37" y1="6" x2="37" y2="12"/>
              <line x1="37" y1="62" x2="37" y2="68"/>
              <line x1="6" y1="37" x2="12" y2="37"/>
              <line x1="62" y1="37" x2="68" y2="37"/>
            </g>
            <text x="37" y="12" fill="#8CA3C4" font-size="7" text-anchor="middle">N</text>
            <text x="37" y="70" fill="#8CA3C4" font-size="7" text-anchor="middle">S</text>
            <text x="4" y="40" fill="#8CA3C4" font-size="7" text-anchor="middle">W</text>
            <text x="70" y="40" fill="#8CA3C4" font-size="7" text-anchor="middle">E</text>
            <g class="needle" style="transform:rotate(${arrowDeg}deg)">
              <line x1="37" y1="37" x2="37" y2="14" stroke="#4FA8FF" stroke-width="3" stroke-linecap="round"/>
              <polygon points="37,8 32,20 42,20" fill="#4FA8FF"/>
              <circle cx="37" cy="37" r="3.5" fill="#EAF2FF"/>
            </g>
          </svg>
        </div>
        <div class="compass-data">
          <div class="spd num">${spd.toFixed(1)}<span style="font-size:13px; color:var(--text-dim);"> m/s</span></div>
          <div class="dir">${dirLabel(dir)} (${Math.round(dir)}°) から</div>
        </div>
      </div>`;
    }
    case 'gust':
      return `<div class="value num">${cur.wind_gusts_10m.toFixed(1)}<span class="unit">m/s</span></div>`;
    case 'temp':
      return `<div class="value num">${cur.temperature_2m.toFixed(1)}<span class="unit">℃</span></div>`;
    case 'feels':
      return `<div class="value num">${cur.apparent_temperature.toFixed(1)}<span class="unit">℃</span></div>
              <div class="sub">実際の気温 ${cur.temperature_2m.toFixed(1)}℃</div>`;
    case 'humidity':
      return `<div class="value num">${Math.round(cur.relative_humidity_2m)}<span class="unit">%</span></div>`;
    case 'elevation':
      return `<div class="value num">${Math.round(w.elevation)}<span class="unit">m</span></div>`;
    case 'precipProb':
      return `<div class="value num">${daily.precipitation_probability_max[0]}<span class="unit">%</span></div>
              <div class="sub">${weatherIcon(cur.weather_code)} 本日</div>`;
    case 'precip':
      return `<div class="value num">${cur.precipitation.toFixed(1)}<span class="unit">mm</span></div>`;
    case 'cloud':
      return `<div class="value num">${Math.round(cur.cloud_cover)}<span class="unit">%</span></div>`;
    case 'pressure':
      return `<div class="value num">${Math.round(cur.surface_pressure)}<span class="unit">hPa</span></div>`;
    case 'uv':
      return `<div class="value num">${daily.uv_index_max[0].toFixed(1)}</div>
              <div class="sub">${uvLabel(daily.uv_index_max[0])}</div>`;
    case 'sun': {
      const sr = new Date(daily.sunrise[0]), ss = new Date(daily.sunset[0]);
      const f = d => d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
      return `<div class="sun-col">
        <div class="row"><span class="ic">🌅</span><span class="t num">${f(sr)}</span><span class="l">日の出</span></div>
        <div class="row"><span class="ic">🌇</span><span class="t num">${f(ss)}</span><span class="l">日没</span></div>
      </div>`;
    }
    case 'weekly': {
      const weekHi = Math.round(Math.max(...daily.temperature_2m_max));
      const weekLo = Math.round(Math.min(...daily.temperature_2m_min));
      return `<div class="weekly-mini">
        <span class="ic">${weatherIcon(daily.weather_code[0])}</span>
        <div class="range">
          <span class="hi num">${weekHi}°</span>
          <span class="lo num">${weekLo}°</span>
        </div>
      </div>`;
    }
    default:
      return '';
  }
}
function uvLabel(v){
  if(v<3) return '弱い';
  if(v<6) return '中程度';
  if(v<8) return '強い';
  if(v<11) return '非常に強い';
  return '極端';
}

/* ========================= グリッド描画 ========================= */
function renderGrid(){
  const enabledOrdered = settings.order.filter(id => settings.enabled.includes(id));
  let html = '';
  enabledOrdered.forEach(id=>{
    const def = CARD_MAP[id];
    if(!def) return;
    html += cardShell(id, def.label, renderCardBody(id), def.wide);
  });
  if(editing){
    html += `<li class="add-tile" id="addTile"><span class="plus">＋</span>カードを追加</li>`;
  }
  grid.innerHTML = html;

  grid.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = btn.getAttribute('data-del');
      settings.enabled = settings.enabled.filter(x=>x!==id);
      saveSettings();
      renderGrid();
    });
  });
  const addTile = document.getElementById('addTile');
  if(addTile) addTile.addEventListener('click', openSheet);

  setupSortable();
}

function setupSortable(){
  if(sortable){ sortable.destroy(); sortable = null; }
  sortable = new Sortable(grid, {
    animation:180,
    delay: 350,
    delayOnTouchOnly: true,
    touchStartThreshold: 6,
    disabled: !editing,
    filter: '.add-tile',
    ghostClass: 'dragging-ghost',
    onStart: ()=>{ if(!editing) enterEdit(); },
    onEnd: ()=>{
      const ids = [...grid.querySelectorAll('.card')].map(el=>el.getAttribute('data-id'));
      // keep disabled cards at the end in their previous relative order
      const disabled = settings.order.filter(id=>!settings.enabled.includes(id));
      settings.order = [...ids, ...disabled];
      saveSettings();
    }
  });
}

/* ========================= 編集モード ========================= */
function enterEdit(){
  editing = true;
  document.body.classList.add('editing');
  doneBtn.classList.add('show');
  editBtn.classList.add('hide');
  renderGrid();
}
function exitEdit(){
  editing = false;
  document.body.classList.remove('editing');
  doneBtn.classList.remove('show');
  editBtn.classList.remove('hide');
  closeSheet();
  renderGrid();
}
editBtn.addEventListener('click', enterEdit);
doneBtn.addEventListener('click', exitEdit);

// 長押しで編集モード（カード本体を直接長押し）
let pressTimer = null;
grid.addEventListener('pointerdown', (e)=>{
  const card = e.target.closest('.card');
  if(!card || editing) return;
  pressTimer = setTimeout(()=>{ enterEdit(); }, 480);
});
['pointerup','pointermove','pointercancel','pointerleave'].forEach(evt=>{
  grid.addEventListener(evt, ()=>{ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } });
});

// 通常タップ：詳細を開けるカード（週間予報など）
grid.addEventListener('click', (e)=>{
  if(editing) return;
  if(e.target.closest('[data-del]')) return;
  const card = e.target.closest('.card[data-tap="1"]');
  if(!card) return;
  const id = card.getAttribute('data-id');
  if(id === 'weekly') openWeeklySheet();
});

/* ========================= 追加シート ========================= */
function openSheet(){
  const disabled = ALL_CARDS.filter(c=>!settings.enabled.includes(c.id));
  if(disabled.length===0){
    sheetList.innerHTML = `<div class="sheet-empty">すべてのカードが表示中です</div>`;
  }else{
    sheetList.innerHTML = disabled.map(c=>`
      <div class="sheet-item">
        <span>${c.label}</span>
        <button data-add="${c.id}">追加</button>
      </div>`).join('');
  }
  sheetList.querySelectorAll('[data-add]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-add');
      settings.enabled.push(id);
      if(!settings.order.includes(id)) settings.order.push(id);
      saveSettings();
      renderGrid();
      openSheet();
    });
  });
  overlay.classList.add('show');
  sheet.classList.add('show');
}
function closeSheet(){
  overlay.classList.remove('show');
  sheet.classList.remove('show');
  weeklySheet.classList.remove('show');
}
overlay.addEventListener('click', closeSheet);

/* ========================= 週間予報 詳細シート ========================= */
function openWeeklySheet(){
  if(!weatherData){ return; }
  const daily = weatherData.daily;
  let html = '';
  for(let i=0;i<daily.time.length;i++){
    html += `<div class="weekly-detail-row">
      <span class="d">${fmtDay(daily.time[i], i)}</span>
      <span class="ic">${weatherIcon(daily.weather_code[i])}</span>
      <span class="pp num">☔ ${daily.precipitation_probability_max[i]}%</span>
      <span class="temps">
        <span class="hi num">${Math.round(daily.temperature_2m_max[i])}°</span>
        <span class="lo num">${Math.round(daily.temperature_2m_min[i])}°</span>
      </span>
    </div>`;
  }
  weeklyList.innerHTML = html;
  overlay.classList.add('show');
  weeklySheet.classList.add('show');
}

/* ========================= データ取得 ========================= */
function setStatus(msg, show=true){
  statusText.textContent = msg;
  statusEl.classList.toggle('show', show);
}

async function fetchWeather(lat, lon){
  setStatus('データを取得しています…');
  const params = new URLSearchParams({
    latitude: lat, longitude: lon,
    current: 'temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,cloud_cover,surface_pressure,wind_speed_10m,wind_direction_10m,wind_gusts_10m',
    daily: 'sunrise,sunset,uv_index_max,temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code',
    timezone: 'auto',
    forecast_days: 7,
    wind_speed_unit: 'ms'
  });
  const [wxRes, elevRes] = await Promise.all([
    fetch(`https://api.open-meteo.com/v1/forecast?${params}`),
    fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lat}&longitude=${lon}`)
  ]);
  if(!wxRes.ok) throw new Error('weather fetch failed');
  const wx = await wxRes.json();
  const elevJson = elevRes.ok ? await elevRes.json() : {elevation:[null]};
  weatherData = { current: wx.current, daily: wx.daily, elevation: elevJson.elevation ? elevJson.elevation[0] : null };
  setStatus('', false);
  renderGrid();
  reverseGeocode(lat, lon);
}

async function reverseGeocode(lat, lon){
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&zoom=14&accept-language=ja`);
    if(!res.ok) throw 0;
    const j = await res.json();
    const a = j.address || {};
    const name = a.suburb || a.neighbourhood || a.town || a.city || a.county || '現在地';
    placeLabel.textContent = name;
  }catch(e){
    placeLabel.textContent = `緯度 ${lat.toFixed(3)}, 経度 ${lon.toFixed(3)}`;
  }
}

function getLocationAndFetch(){
  setStatus('位置情報を取得しています…');
  if(!navigator.geolocation){
    setStatus('この端末では位置情報が利用できません');
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => fetchWeather(pos.coords.latitude, pos.coords.longitude),
    err => {
      setStatus('位置情報を取得できませんでした。設定を確認してください');
      placeLabel.textContent = '位置情報オフ';
    },
    { enableHighAccuracy:true, timeout:15000, maximumAge:60000 }
  );
}
document.getElementById('refreshBtn').addEventListener('click', getLocationAndFetch);

/* ========================= 初期化 ========================= */
renderGrid();
getLocationAndFetch();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
